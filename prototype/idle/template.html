<title>Greenhood Idle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: app de uma tela no celular — HUD (grana, Paranoia, Estamina), cena da estufa (toque),
   barra de venda e cinco abas: Estufa, Lavagem, Loja, Cidade e Perfil. */
:root{
  --bg:#1a1420; --panel:#272436; --panel-2:#352450; --line:#403d54; --well:#1f1a2b;
  --fg:#ebe9e1; --muted:#9a9bad; --leaf:#7cb342; --leaf-2:#bcd95e;
  --dirty:#f0c94f; --clean:#48a38a; --heat:#d95463; --plum:#8160a8; --sta:#6590cc;
  --display:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --num:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header{background:var(--panel);padding-block:8px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--bg)}
.money{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.m small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.m b{font-family:var(--num);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m.dirty b{color:var(--dirty)} .m.clean b{color:var(--clean)}
.m.lvl{text-align:right} .m.lvl b{color:#c7a6ff}
.meter{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:12px}
.meter span:first-child{text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter span:last-child{font-family:var(--num);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bg);border:2px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0%}
.para .bar{height:16px}
.para .bar i{background:linear-gradient(90deg,var(--clean),var(--dirty) 55%,var(--heat) 80%)}
.para .bar::after{content:"";position:absolute;top:0;bottom:0;left:60%;width:2px;background:#1a142088}
.para .bar::before{content:"";position:absolute;top:0;bottom:0;left:80%;width:2px;background:var(--heat);z-index:1}
.para span:first-child{color:#f2918a;font-weight:700}
.sta .bar i{background:var(--sta)}
.status{font-size:12px;color:var(--muted);min-height:15px}
.status.warn{color:var(--dirty)} .status.danger{color:var(--heat);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
#scene{position:relative;touch-action:manipulation;cursor:pointer;background:#000;flex:0 0 auto}
canvas{display:block;width:100%;image-rendering:pixelated}
.tag{position:absolute;font-size:12px;background:#1a1420d9;padding:3px 8px;border:2px solid #1a1420;pointer-events:none}
#place{left:8px;top:8px} #busy{right:8px;top:8px;color:var(--leaf-2)}
#tip{position:absolute;left:8px;right:8px;top:36px;z-index:5;display:flex;gap:8px;align-items:flex-start;background:#fffbef;color:#1a1420;border:2px solid #1a1420;box-shadow:3px 3px 0 #1a1420;padding:8px 10px;font-size:13px;line-height:1.35;cursor:default;animation:pop .25s}
#tip[hidden]{display:none}
#tip .who{font-size:26px;line-height:1}
#tip b{color:#6e2834}
#tip .acts{display:flex;gap:6px;margin-top:6px}
#tip button{background:#1a1420;color:#fffbef;padding:3px 8px;font-size:12px}
#tip button.ghost{background:none;color:#1a1420;text-decoration:underline}
#tip:after{content:"";position:absolute;left:18px;bottom:-9px;border:8px solid transparent;border-top-color:#1a1420;border-bottom:0}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#hint{left:50%;bottom:8px;transform:translateX(-50%);transition:opacity .4s;white-space:nowrap}
.sell{background:var(--panel);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.stockline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.stockline b{color:var(--leaf-2);font-family:var(--num);font-size:13px}
.sbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--dirty);outline-offset:2px}
.sb{background:var(--panel-2);border:2px solid var(--bg);box-shadow:inset 0 -3px 0 #0006;padding:5px 1px 6px;display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.15}
.sb b{font-size:13px} .sb small{font-size:10px;color:var(--muted);white-space:nowrap}
.sb[data-l="2"] b{color:var(--dirty)} .sb[data-l="3"] b{color:#f2918a} .sb[data-l="4"] b{color:var(--heat)}
.sb:active{transform:translateY(2px);box-shadow:none}
.sb:disabled{opacity:.4}
.cd{height:4px;background:var(--bg)} .cd i{display:block;height:100%;background:var(--leaf);width:0%}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--bg);padding-top:4px}
nav button{padding:8px 0 7px;font-size:13px;color:var(--muted);background:var(--panel);border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--fg);border-top-color:var(--leaf);background:var(--line)}
main{flex:1;overflow-y:auto;background:var(--line);padding-block:8px 20px;display:flex;flex-direction:column;gap:6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0;font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--bg);padding:6px 8px;min-width:0}
.row.sel{border-color:var(--leaf)} .row.locked{opacity:.65}
.ico{width:44px;height:44px;image-rendering:pixelated;background:#1a142088}
.emo{display:grid;place-items:center;font-size:24px}
.t{min-width:0} .t b{display:block;font-size:15px} .t small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.t .req{color:#f2918a} .t .ok{color:var(--leaf-2)}
.lv{font-family:var(--num);font-size:11px;color:var(--dirty);margin-left:6px}
.buy{background:var(--leaf);color:#14292b;font-weight:700;padding:8px 8px;min-width:86px;border:2px solid #1a1420;box-shadow:inset 0 -3px 0 #0003;font-family:var(--num);font-size:12px;white-space:nowrap}
.buy.clean{background:var(--clean);color:#0d2026} .buy.dirty{background:var(--dirty);color:#2b1a10}
.buy:disabled{background:#403d54;color:var(--muted)}
.chips{display:flex;gap:4px} .chips .buy{min-width:0;padding:7px 8px}
.card{background:var(--panel);border:2px solid var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.card p{font-size:14px;line-height:1.45;color:#d6d4cc;margin:0}
.big{font-family:var(--num);font-size:20px;color:#c7a6ff}
.prog{height:8px;background:var(--bg);border:2px solid var(--line)} .prog i{display:block;height:100%;background:var(--clean);width:0%}
.attr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.attr b{font-size:15px} .attr .v{font-family:var(--num);color:var(--dirty)} .attr small{grid-column:1/-1;color:var(--muted);font-size:12px}
.attr .prog{grid-column:1/-1}
.log{font-size:12px;color:var(--muted);line-height:1.5}
.log .batida,.log .flagrante{color:#f2918a} .log .attr{color:var(--leaf-2)} .log .lenda{color:#c7a6ff}
.danger{background:var(--plum);color:#fffbef;font-weight:700;padding:10px;border:2px solid #1a1420;font-size:15px}
.danger:disabled{background:#403d54;color:var(--muted)}
.modal{position:fixed;inset:0;background:#1a1420d0;display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:360px;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:25;background:#fffbef;color:#1a1420;border:3px solid #1a1420;padding:8px 12px;font-size:14px;max-width:92vw;box-shadow:0 4px 0 #0006;pointer-events:none}
.toast.bad{background:#f2918a}
#master{left:8px;bottom:8px;color:#fff0a6;border-color:#d1952e;pointer-events:none}
.sheet{position:fixed;inset:0;background:#1a1420d0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--panel);border-top:3px solid var(--dirty);width:100%;max-width:520px;max-height:86%;overflow-y:auto;
  padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet .top b{font-size:18px;color:var(--dirty)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid button{background:var(--panel-2);border:2px solid var(--bg);padding:8px 4px;font-size:13px;line-height:1.2;box-shadow:inset 0 -3px 0 #0006}
.grid button.on{background:var(--leaf);color:#14292b;font-weight:700}
.grid button.warn{background:#6e1b3d}
.grid button:active{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.status.danger{animation:none}}
</style>

<div id="app">
  <header class="pad">
    <div class="money">

<script>
"use strict";
const IMG = { estagios: "__ESTAGIOS__", equip: "__EQUIP__", vasos: "__VASOS__" };
SCENES.registerRooms(__COMODOS__, __SHIFT__);
const E = window.ECON;
const SAVE_KEY = "greenhood-idle-v2";
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- formatação
function fmt(n) {
  if (!isFinite(n)) return "∞";
  const neg = n < 0; n = Math.abs(n);
  let out;
  if (n < 1000) out = Math.floor(n).toString();
  else {
    const u = ["mil", "mi", "bi", "tri", "qua", "qui", "sex", "sep"];
    let i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    out = (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)).replace(".", ",") + " " + u[i];
  }
  return (neg ? "-" : "") + out;
}
const $$ = (n) => "$" + fmt(n);
const pct = (x) => Math.round(x * 100) + "%";
function dur(t) {
  t = Math.max(0, Math.ceil(t));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}h${String(m).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}

// ---------------------------------------------------------------- estado
let S;
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign(E.newState(), d.s);
      S.place = Math.min(S.place, E.PLACES.length - 1); // saves antigos podiam estar na Estação Espacial
      const away = (Date.now() - d.at) / 1000;
      if (away > 30) {
        const r = E.offline(S, away);
        const parts = [];
        if (r.units > 0) parts.push(`colheu <b>${fmt(r.units)}</b> unidades`);
        if (r.dirty > 0) parts.push(`${S.ze ? "o Zé vendeu e " : ""}entrou <b>${$$(r.dirty)}</b> de grana suja`);
        if (r.clean > 0) parts.push(`a lavagem rendeu <b>${$$(r.clean)}</b> limpos`);
        modal(`Você ficou fora ${dur(r.seconds)}`, (parts.join(", ") || "nada aconteceu") + "." + (r.busted ? "<br><b>A polícia passou por lá enquanto você estava fora.</b>" : ""));
      }
      return;
    }
  } catch (e) {}
  S = E.newState(Math.floor(Math.random() * 1e9));
  modal("Bem-vindo ao Greenhood", "Você tem um quartinho, dois vasos e $20.<br>Toque na cena para as plantas crescerem, venda o que colher e <b>cuidado com a Paranoia</b>: em 100% a polícia leva tudo.");
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ at: Date.now(), s: S })); } catch (e) {} }

// ---------------------------------------------------------------- sprites
const sprites = {};
const loadImg = (k) => new Promise((r) => { const i = new Image(); i.onload = () => { sprites[k] = i; r(); }; i.src = IMG[k]; });
function icon(sheet, sx, sy, w, h) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h; c.className = "ico";
  const x = c.getContext("2d"); x.imageSmoothingEnabled = false;
  if (sprites[sheet]) x.drawImage(sprites[sheet], sx, sy, w, h, 0, 0, w, h);
  return c;
}
// quadro do estágio na folha plantas_estagios (3 colunas, células 32x40)
function stageCell(seed, f) {
  if (f < 0.12) return [0, 0];
  if (f < 0.28) return [1, 0];
  if (f < 0.45) return [2, 0];
  const row = seed + 1;
  return [f < 0.65 ? 0 : f < 0.85 ? 1 : 2, row];
}
const seedIcon = (i) => icon("estagios", 64, (i + 1) * 40, 32, 40);
const equipIcon = (i) => icon("equip", (i % 9) * 32, Math.floor(i / 9) * 32, 32, 32);

// ---------------------------------------------------------------- cena
const cv = $("cv"), g = cv.getContext("2d");
let W = 320, H = 180, FLOOR = 66, curRoom = -1;
let K = 1;
// cada imóvel tem o seu tamanho de cômodo (16:9); o canvas acompanha
function setRoom() {
  if (S.place === curRoom) return;
  const r = SCENES.size(S.place);
  W = r.w; H = r.h; FLOOR = r.floor; curRoom = S.place;
  fitCanvas();
}
function fitCanvas() {
  const css = cv.getBoundingClientRect().width || W;
  K = Math.max(1, Math.ceil((css * (window.devicePixelRatio || 1)) / W));
  cv.width = W * K; cv.height = H * K;
  g.setTransform(K, 0, 0, K, 0, 0); g.imageSmoothingEnabled = false;
}
window.addEventListener("resize", fitCanvas);
const THEMES = [
  { wall: "#a3423a", mortar: "#6e2834", hi: "#cc6748", floor: "#8f6040", line: "#6b4234" },
  { wall: "#646379", mortar: "#403d54", hi: "#8f90a2", floor: "#8f90a2", line: "#646379" },
  { wall: "#272436", mortar: "#1b4a55", hi: "#2a7470", floor: "#403d54", line: "#352450" },
];
function drawRoom(tier) {
  const t = THEMES[tier];
  g.fillStyle = t.wall; g.fillRect(0, 0, W, FLOOR);
  g.fillStyle = t.mortar;
  if (tier === 0) {
    for (let y = 0; y < FLOOR; y += 8) { g.fillRect(0, y + 7, W, 1); for (let x = (y / 8) % 2 ? 8 : 0; x < W; x += 16) g.fillRect(x + 15, y, 1, 7); }
    g.fillStyle = t.hi; for (let y = 0; y < FLOOR; y += 8) for (let x = (y / 8) % 2 ? 8 : 0; x < W; x += 32) g.fillRect(x, y, 14, 1);
    g.fillStyle = "#1a1420"; g.fillRect(232, 10, 60, 38); g.fillStyle = "#a6cbeb"; g.fillRect(235, 13, 54, 32);
    g.fillStyle = "#6590cc"; g.fillRect(235, 29, 54, 16); g.fillStyle = "#8a4a33"; g.fillRect(261, 13, 2, 32); g.fillRect(235, 28, 54, 2);
  } else if (tier === 1) {
    for (let x = 0; x < W; x += 6) g.fillRect(x, 0, 2, FLOOR);
    g.fillStyle = "#f0c94f"; for (let x = 24; x < W; x += 92) g.fillRect(x, 4, 44, 3);
  } else {
    for (let x = 0; x < W; x += 16) g.fillRect(x, 0, 1, FLOOR);
    for (let y = 0; y < FLOOR; y += 16) g.fillRect(0, y, W, 1);
    g.fillStyle = "#48a38a"; g.fillRect(0, FLOOR - 7, W, 2);
    g.fillStyle = "#8fd4a8"; for (let x = 24; x < W; x += 92) g.fillRect(x, 4, 44, 3);
  }
  g.fillStyle = "#1a1420"; g.fillRect(0, FLOOR - 3, W, 3);
  g.fillStyle = t.floor; g.fillRect(0, FLOOR, W, H - FLOOR);
  g.fillStyle = t.line; for (let y = FLOOR + 12; y < H; y += 22) g.fillRect(0, y, W, 1);
  if (tier === 0) { g.fillStyle = "#ffffff1c"; g.beginPath(); g.moveTo(228, FLOOR); g.lineTo(296, FLOOR); g.lineTo(334, H); g.lineTo(256, H); g.fill(); }
}
// vasos espalhados na área de plantio do cômodo (meta.pots = x, y, largura, altura do topo dos vasos)
function plantArea() {
  const m = SCENES.roomMeta(S.place);
  const [ax, ay, aw, ah0] = m ? m.pots : [24, FLOOR + 34, W - 48, H - FLOOR - 62];
  return [ax, ay, aw, m ? Math.min(ah0, m.room[1] + m.room[3] - 27 - ay) : ah0];
}
// do Container em diante: calhas de hidroponia. Cabem mais plantas (22 px entre elas, contra 30-44 dos vasos)
const HYDRO_SP = 22;
function layoutHydro(n) {
  const [ax, ay, aw, ah] = plantArea();
  const maxPer = Math.max(1, Math.floor((aw + 10) / HYDRO_SP));
  const rows = Math.ceil(n / maxPer), per = Math.ceil(n / rows);
  const rs = rows > 1 ? Math.min(34, ah / (rows - 1)) : 0;
  const top = ay + (ah - (rows - 1) * rs) / 2;
  const out = [];
  for (let r = 0; r < rows; r++) {
    const count = Math.min(per, n - r * per), gw = count * HYDRO_SP + 8;
    const gx = Math.round(ax + aw / 2 - gw / 2) + (rows > 2 && r % 2 ? 4 : 0), gy = Math.round(top + r * rs) + 6;
    out.push({ x: gx, y: gy, w: gw, count, first: r * per });
  }
  return out;
}
// calha: tampo com os copinhos de rede, frente, pés. tier 1 = PVC branco, tier 2 = high-tech escura com LED verde
function paintGutter(c, w, count, tier) {
  const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(x, y, ww, hh); };
  const OL = "#1a1420";
  const hi = tier === 2;
  const top = hi ? "#646379" : "#bfbfc8", lip = hi ? "#8f90a2" : "#ebe9e1", front = hi ? "#403d54" : "#ebe9e1", fdark = hi ? "#272436" : "#bfbfc8";
  R(2, 9, 2, 5, "#646379"); R(w - 4, 9, 2, 5, "#646379"); R(2, 13, 2, 1, OL); R(w - 4, 13, 2, 1, OL);   // pés
  R(0, 0, w, 10, OL);
  R(1, 1, w - 2, 5, top); R(1, 1, w - 2, 1, lip);
  R(1, 6, w - 2, 3, front); R(1, 8, w - 2, 1, fdark);
  if (hi) R(2, 7, w - 4, 1, "#48a38a");
  else { R(w - 9, 6, 4, 3, "#bfbfc8"); R(w - 8, 7, 2, 1, "#646379"); }                             // tampa da ponta
  R(w - 2, 3, 2, 3, hi ? "#2a7470" : "#3a5ea3");                                                   // mangueira de retorno
  for (let k = 0; k < count; k++) {                                                                 // copinhos de rede
    const cx = 4 + HYDRO_SP / 2 + k * HYDRO_SP;
    R(cx - 3, 2, 6, 3, OL); R(cx - 2, 2, 4, 2, "#47292b"); R(cx - 2, 2, 4, 1, "#272436");
  }
}
function layout(n) {
  const [ax, ay, aw, ah] = plantArea();
  let best = null;
  for (let per = 1; per <= n; per++) {               // colunas: espaço parecido com o de um vaso de verdade
    const rows = Math.ceil(n / per);
    const cs = per > 1 ? Math.min(44, aw / (per - 1)) : 0, rs = rows > 1 ? Math.min(34, ah / (rows - 1)) : 0;
    if (per > 1 && cs < 26) break;
    const score = Math.abs((per > 1 ? cs : 44) / (rows > 1 ? rs : 34) - 1.5) + (rows > 1 && rs < 14 ? 5 : 0) + rows * 0.08;
    if (!best || score < best.score) best = { per, rows, cs, rs, score };
  }
  const { per, rows, cs, rs } = best, pts = [];
  const top = ay + (ah - (rows - 1) * rs) / 2;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / per), c = i % per, inRow = Math.min(per, n - r * per);
    const cx = ax + aw / 2 - ((inRow - 1) * cs) / 2 + c * cs + (rows > 2 && r % 2 ? cs * 0.25 : 0);
    pts.push([Math.round(cx - 16), Math.round(top + r * rs)]);
  }
  return { pts };
}
const fx = [];
function float(s, x, y, c = "#fffbef") { fx.push({ s, x, y, c, t: 0 }); if (fx.length > 40) fx.shift(); }
let shake = 0, lastTime = 0;
function draw() {
  const tier = E.PLACES[S.place].tier;
  setRoom();
  g.save();
  if (shake > 0) g.translate(Math.round((Math.random() - 0.5) * shake), 0);
  SCENES.background(g, S.place);
  const hydro = tier >= 1;
  const plantOf = (i) => { const p = S.pots[i]; return { p, f: p.on ? p.g / E.SEEDS[p.s].time : 0, st: p.on ? stageCell(p.s, p.on ? p.g / E.SEEDS[p.s].time : 0) : null }; };
  const paintPlant = (st) => (c) => { if (st && sprites.estagios) c.drawImage(sprites.estagios, st[0] * 32, st[1] * 40, 32, 40, 0, 0, 32, 40); };
  const items = [], marks = [];
  if (hydro) {
    // cada calha, e logo depois as plantas dela (a calha da frente cobre o pé das de trás)
    for (const gt of layoutHydro(S.pots.length)) {
      items.push({ x: gt.x, y: gt.y, w: gt.w, h: 14, foot: 0, key: "calha:" + gt.count + ":" + tier, paint: (c) => paintGutter(c, gt.w, gt.count, tier) });
      for (let k = 0; k < gt.count; k++) {
        const i = gt.first + k, { p, f, st } = plantOf(i), cx = gt.x + 4 + HYDRO_SP / 2 + k * HYDRO_SP;
        if (st) items.push({ x: cx - 16, y: gt.y + 4 - 40, w: 32, h: 40, foot: -9, key: "p:" + st.join(","), paint: paintPlant(st) });
        marks.push({ on: p.on, f, x: cx, top: gt.y + 4 - 26, bar: [cx - 4, gt.y + 7, 8] });
      }
    }
  } else {
    // cada vaso + planta é um sprite 32x58 (vaso embaixo, planta saindo da terra)
    layout(S.pots.length).pts.forEach(([x, y], i) => {
      const { p, f, st } = plantOf(i);
      const pf = i % 3 === 2 ? 2 : i % 2;
      items.push({ x, y: y - 34, w: 32, h: 58, foot: 2, key: pf + ":" + (st ? st.join(",") : "-"),
        paint(c) { if (sprites.vasos) c.drawImage(sprites.vasos, pf * 32, 0, 32, 24, 0, 34, 32, 24); paintPlant(st)(c); } });
      marks.push({ on: p.on, f, x: x + 16, top: y - 25, bar: [x + 8, y + 22, 16], pot: true });
    });
  }
  // a cena acende cada sprite pelo mapa de luz e projeta a sombra
  if (sprites.vasos && sprites.estagios) SCENES.plants(g, S.place, items);
  for (const m of marks) {
    if (!m.on) { g.fillStyle = "#d95463"; g.font = "bold 9px monospace"; g.fillText("$", m.x - 3, m.top + 27); }
    else if (m.f > 0.92 && Math.floor(lastTime * 4) % 2 === 0) { g.fillStyle = "#fff0a6"; g.fillRect(m.x + 8, m.top, 1, 3); g.fillRect(m.x + 7, m.top + 1, 3, 1); }
    const [bx, by, bw] = m.bar;
    g.fillStyle = "#1a1420"; g.fillRect(bx, by, bw, m.pot ? 3 : 2);
    g.fillStyle = "#7cb342"; g.fillRect(bx + (m.pot ? 1 : 0), by + (m.pot ? 1 : 0), Math.round((bw - (m.pot ? 2 : 0)) * Math.min(1, m.f)), 1);
  }
  SCENES.lighting(g, S.place);
  g.restore();
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i]; p.t += 1 / 60; p.y -= 0.45;
    g.globalAlpha = Math.max(0, 1 - p.t / 1.2);
    g.font = "bold 10px 'Silkscreen',monospace";
    g.fillStyle = "#1a1420"; g.fillText(p.s, p.x + 1, p.y + 1); g.fillStyle = p.c; g.fillText(p.s, p.x, p.y);
    g.globalAlpha = 1;
    if (p.t > 1.2) fx.splice(i, 1);
  }
  shake = Math.max(0, shake - 0.6);
}

function row({ ico, emoji, title, lv, desc, btn, cls = "", btnCls = "", enabled, onClick }) {

  E.SEEDS.map((sd, i) => [sd, i]).reverse().forEach(([sd, i]) => {
    const lock = E.seedLocked(S, sd);
    const profit = sd.prod * E.prodMult(S) * sd.sell - sd.price;
    if (lock.length && i > 0 && E.seedLocked(S, E.SEEDS[i - 1]).length) return; // mostra só a próxima trancada
    row({
      ico: seedIcon(i), title: sd.name, cls: (i === S.seed ? "sel" : "") + (lock.length ? " locked" : ""),
      desc: lock.length ? `<span class="req">Precisa: ${lock.join(", ")}</span>`
        : `Semente ${$$(sd.price)} · ${sd.prod} un × ${$$(sd.sell)} · ${sd.time}s · lucro ~${$$(profit)}/colheita`,
      btn: lock.length ? null : i === S.seed ? "Plantando" : "Plantar", enabled: () => i !== S.seed,
      onClick: () => E.chooseSeed(S, i),

  $("dirty").textContent = $$(S.dirty);

  $("lvl").textContent = E.level(S);

  $("sta").style.width = Math.min(100, S.sta) + "%"; $("stan").textContent = Math.floor(S.sta);
  const st = $("status");
  const nextRaid = E.R.raidEvery - S.raidT;
  if (p > E.R.raidAt) { st.className = "status danger"; st.textContent = `🚨 Polícia rondando! Próxima ronda em ${dur(nextRaid)} (50% de chance de batida)`; }
  else if (p >= 60) { st.className = "status warn"; st.textContent = "Paranoia alta: tudo na cidade custa o dobro de Estamina. Acima de 80% a polícia faz rondas."; }

  else { st.className = "status"; st.textContent = `Renda estimada ${$$(E.incomePerSec(S))}/s · Lenda ${S.legend}`; }
  $("units").textContent = fmt(E.stockUnits(S));
  $("value").textContent = $$(E.stockValue(S) * E.priceMult(S, 0));
  document.querySelectorAll(".sb").forEach((b) => {
    const i = +b.dataset.l, L = E.SALES[i];

    b.querySelector("[data-q]").textContent = (L.pct >= 1 ? "tudo" : Math.round(L.pct * 100) + "%") + " · +" + Math.round(E.paraOf(S, i)) + "👁";
    b.querySelector("[data-r]").textContent = "risco " + Math.round(E.riskOf(S, i) * 100) + "%";
  });
  $("cd").style.width = S.saleCd > 0 ? pct(1 - S.saleCd / E.saleCooldown(S)) : "100%";
  $("cdtext").textContent = S.saleCd > 0 ? `próxima venda em ${Math.ceil(S.saleCd)}s` : E.stockUnits(S) > 0 ? "pronto para vender" : "";
  $("place").textContent = E.PLACES[S.place].name + (S.ze ? " · Zé vendendo" : "");

  const m = el(`<div class="modal"><div class="card">
    <b style="font-size:18px">🚨 BATIDA POLICIAL</b>
    <p>${b.why || ""}<br>A polícia levou <b>tudo</b>: grana suja e limpa, estoque, equipamentos e o esconderijo. Você volta para o Armário, com um vaso só.</p>
    <p>O que é seu ninguém tira: <b>Botânica, Lábia, Furtividade, Segurança</b>, Respeito e Lenda.<br>Na delegacia você ficou famoso: <span class="big">+${b.gain || 0} Lenda</span></p>
    <p style="text-align:left;border-top:2px solid var(--line);padding-top:8px"><b>Saiu só com a roupa do corpo?</b> Seus vasos ainda têm a última muda. Para conseguir grana e recomeçar:</p>
    <div class="help" style="display:flex;flex-direction:column;gap:6px"></div>
    <small data-res style="color:var(--leaf-2);min-height:16px;display:block"></small>
    <button class="buy" data-ok style="align-self:center">Bora recomeçar</button>
  </div></div>`);
  const box = m.querySelector(".help"), res = m.querySelector("[data-res]");
  const opts = [
    ["🦈", "Pedir pro agiota", () => `Se tiver coragem: ${$$(E.R.loan)} agora, ele cobra ${$$(E.R.loanBack)} e a Paranoia sobe.`,
      () => S.debt <= 0 && E.safe(S, 30), () => E.borrow(S) && `O agiota te passou ${$$(E.R.loan)}. Não esquece de pagar...`],
    ["🤲", "Mendigar na calçada", () => "Gasta Estamina e rende $1–3. Pode tocar várias vezes.",
      () => S.sta >= 16, () => { const g = E.beg(S); return g > 0 && `Alguém teve pena: +$${g}. Total: ${$$(S.dirty)}`; }],
    ["👵", "Ir na casa da vozinha", () => "A Vó Dita te dá $5, um prato de comida (+⚡) e às vezes um pacotinho de sementes.",
      () => S.time >= S.avoT && E.safe(S, 10), () => E.visitAvo(S) && `A Vó te deu um abraço e um troco. Total: ${$$(S.dirty)}`],
  ];
  const btns = [];
  for (const [emo, title, desc, can, act] of opts) {
    const r = el(`<button class="row" style="text-align:left;width:100%"><div class="ico emo">${emo}</div><div class="t"><b>${title}</b><small>${desc()}</small></div><span></span></button>`);
    r.onclick = () => { const out = act(); if (out) { res.textContent = out; refresh(); } else res.textContent = "Agora não dá."; paint(); };
    btns.push([r, can]);
    box.appendChild(r);
  }
  const paint = () => btns.forEach(([r, can]) => { r.disabled = !can(); r.style.opacity = r.disabled ? 0.45 : 1; });
  paint();
  m.querySelector("[data-ok]").onclick = () => m.parentNode && m.parentNode.removeChild(m);
  document.body.appendChild(m);
}

function modal(title, html) {
  const m = el(`<div class="modal"><div class="card"><b style="font-size:18px">${title}</b><p>${html}</p><button class="buy" style="align-self:center">OK</button></div></div>`);
  m.querySelector("button").onclick = () => m.remove();
  document.body.appendChild(m);
}
let toastT;
function toast(text, bad) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = el(`<div class="toast${bad ? " bad" : ""}">${text}</div>`);
  document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2600);
}


// ---------------------------------------------------------------- modo master (testes)
function closeSheet(sh) { sh.parentNode && sh.parentNode.removeChild(sh); }
function openMaster() {
  S.cheat = Object.assign({ on: true, speed: 1, noPolice: false }, S.cheat || {}, { on: true });
  const sh = el(`<div class="sheet"><div class="in pad"><div class="top"><b>🛠 Modo master</b><button class="buy" data-close>Fechar</button></div>
    <p style="font-size:13px;color:var(--muted);margin:0">Atalhos para testar. Tudo aqui vale só neste navegador.</p></div></div>`);
  const box = sh.querySelector(".in");
  const best = () => { for (let i = E.SEEDS.length - 1; i >= 0; i--) if (E.seedOk(S, i)) return i; return 0; };
  function skip(t) {
    const r = E.offline(S, t);
    toast(`Pulou ${dur(t)}: +${$$(r.dirty)} suja, +${$$(r.clean)} limpa, +${fmt(r.units)} un${r.busted ? " · BATIDA!" : ""}`);
  }
  const groups = [
    ["Dinheiro", [
      ["+$1 mil suja", () => (S.dirty += 1e3)], ["+$1 mi suja", () => (S.dirty += 1e6)], ["+$1 bi suja", () => (S.dirty += 1e9)],
      ["+$1 mil limpa", () => (S.clean += 1e3)], ["+$1 mi limpa", () => (S.clean += 1e6)], ["+$1 bi limpa", () => (S.clean += 1e9)],
    ]],
    ["Polícia", [
      ["Paranoia 0%", () => (S.para = 0)], ["Paranoia 85% (ronda)", () => (S.para = 85)],
      [() => (S.cheat.noPolice ? "Imune: LIGADO" : "Imune à polícia"), () => (S.cheat.noPolice = !S.cheat.noPolice), () => S.cheat.noPolice],
      ["Forçar batida", () => { const n = S.cheat.noPolice; S.cheat.noPolice = false; S.para = 150; E.tick(S, 0.01); S.cheat.noPolice = n; }, null, "warn"],
      ["Próxima ronda já", () => (S.raidT = E.R.raidEvery - 1)],
      ["Quitar agiota", () => (S.debt = 0)],
    ]],
    ["Personagem", [
      ["Estamina 100", () => (S.sta = 100)],
      ["Atributos +5", () => { for (const k in S.attrs) S.attrs[k] += 5; }],
      ["Botânica 30", () => (S.attrs.bot = Math.max(30, S.attrs.bot))],
      ["Lábia 10", () => (S.attrs.lab = Math.max(10, S.attrs.lab))],
      ["+10 Lenda", () => (S.legend += 10)],
      ["+1000 Respeito", () => (S.resp += 1000)],
    ]],
    ["Progresso", [
      ["Todos os equipamentos", () => E.EQUIP.forEach((e) => (S.equip[e.id] = Math.max(1, E.lvl(S, e.id))))],
      ["Próximo imóvel", () => { if (E.PLACES[S.place + 1]) S.place++; }],
      ["Último imóvel", () => (S.place = E.PLACES.length - 1)],
      ["Encher de vasos", () => { while (S.pots.length < E.maxPots(S)) S.pots.push({ g: 0, s: S.seed, on: false }); }],
      ["Melhor semente", () => E.chooseSeed(S, best())],
      ["Tudo pronto p/ colher", () => S.pots.forEach((p) => { p.on = true; p.g = E.SEEDS[p.s].time * 0.999; })],
      ["+100 un no estoque", () => (S.stock[best()] += 100)],
      ["Venda sem espera", () => (S.saleCd = 0)],
      ["Concluir lavagem e cidade", () => { S.laundry.forEach((l) => (l.done = S.time)); if (S.city) S.city.end = S.time; S.avoT = S.time; }],
    ]],
    ["Tempo", [
      ["Velocidade ×1", () => (S.cheat.speed = 1), () => S.cheat.speed === 1],
      ["Velocidade ×10", () => (S.cheat.speed = 10), () => S.cheat.speed === 10],
      ["Velocidade ×60", () => (S.cheat.speed = 60), () => S.cheat.speed === 60],
      ["Pular 10 min", () => skip(600)], ["Pular 1 hora", () => skip(3600)], ["Pular 8 horas", () => skip(8 * 3600)],
    ]],
  ];
  const paints = [];
  for (const [title, items] of groups) {
    box.appendChild(el(`<h3>${title}</h3>`));
    const grid = el(`<div class="grid"></div>`);
    for (const [label, fn, isOn, cls] of items) {
      const b = el(`<button${cls ? ` class="${cls}"` : ""}></button>`);
      const paint = () => { b.textContent = typeof label === "function" ? label() : label; if (isOn) b.classList.toggle("on", !!isOn()); };
      b.onclick = () => { fn(); paints.forEach((f) => f()); renderPanel(); refresh(); checkEvents(); save(); };
      paint(); paints.push(paint); grid.appendChild(b);
    }
    box.appendChild(grid);
  }
  box.appendChild(el(`<h3>Save</h3>`));
  const wipe = el(`<button class="danger" style="background:#6e1b3d">Apagar progresso e começar do zero</button>`);
  wipe.onclick = () => {
    if (!wipe.dataset.sure) { wipe.dataset.sure = "1"; wipe.textContent = "Toque de novo para confirmar"; return; }
    try { localStorage.setItem(SAVE_KEY, ""); } catch (e) {}
    S = E.newState(Math.floor(Math.random() * 1e9));
    S.cheat = { on: true, speed: 1, noPolice: false };
    seenBusts = 0; seenLog = 0;
    closeSheet(sh); renderPanel(); refresh(); save(); toast("Progresso zerado.");
  };
  box.appendChild(wipe);
  const off = el(`<button class="buy" style="align-self:flex-start;margin-top:6px">Desligar modo master</button>`);
  off.onclick = () => { S.cheat = { on: false, speed: 1, noPolice: false }; closeSheet(sh); refresh(); save(); };
  box.appendChild(off);
  sh.querySelector("[data-close]").onclick = () => closeSheet(sh);
  sh.addEventListener("click", (e) => { if (e.target === sh) closeSheet(sh); });
  document.body.appendChild(sh);
}

// ---------------------------------------------------------------- laço
let last = performance.now(), acc = 0, saveT = 0;
// ---------------------------------------------------------------- dicas da Vó (1 minuto sem fazer nada)
const TIP_IDLE = 60;
let idleT = 0, tipTab = null, lastTip = "";
function nextTip() {
  const units = E.stockUnits(S), place = E.PLACES[S.place], nextPlace = E.PLACES[S.place + 1];
  const lockedSeed = E.SEEDS.find((sd) => E.seedLocked(S, sd).length);
  const tips = [];
  if (S.para >= 60) tips.push(["Paranoia em <b>" + Math.round(S.para) + "%</b>! Para de vender um pouco e deixa esfriar. Acima de 80% a polícia faz ronda. O Spa da cidade acalma.", "cidade"]);
  if (S.pots.some((p) => !p.on)) tips.push(["Tem vaso vazio! Escolhe uma semente na Estufa para começar a plantar.", "estufa"]);
  if (units > 0 && S.saleCd <= 0 && S.para < 60) tips.push(["Você tem <b>" + units + " un</b> paradas no estoque. Vende no <b>Discreto (5%)</b>: chama menos atenção da polícia.", null]);
  if (S.pots.length < E.maxPots(S) && S.dirty >= E.potCost(S)) tips.push(["Dá pra comprar <b>mais um vaso</b> com a grana suja. Mais plantas, mais grana.", "estufa"]);
  if (S.pots.length >= E.maxPots(S) && nextPlace && S.clean >= nextPlace.cost) tips.push(["O " + place.name + " ficou pequeno. Você já pode se mudar para o <b>" + nextPlace.name + "</b>!", "estufa"]);
  if (S.dirty > 200 && S.clean < S.dirty / 2 && !S.laundry.length) tips.push(["Grana suja só compra semente e vaso. <b>Lava o dinheiro</b> para comprar equipamento e esconderijo.", "lavagem"]);
  if (!S.ze && S.clean >= E.R.zeCost) tips.push(["Contrata o <b>Zé</b>: ele vende sozinho, até com o jogo fechado.", "loja"]);
  if (lockedSeed) tips.push(["Para plantar <b>" + lockedSeed.name + "</b> falta: " + E.seedLocked(S, lockedSeed).join(", ") + ".", "loja"]);
  if (S.sta < 30) tips.push(["Tá sem energia. Toma um café na Cidade ou passa aqui em casa que eu te dou um prato de comida.", "cidade"]);
  tips.push(["Toca nas plantas para elas crescerem mais rápido. Cada toque é água e carinho.", null]);
  return tips.find((t) => t[0] !== lastTip) || tips[0];
}
function showTip() {
  const [text, tabName] = nextTip();
  lastTip = text; tipTab = tabName;
  $("tiptext").innerHTML = text;
  $("tipgo").hidden = !tabName;
  $("tip").hidden = false;
}
function hideTip() { $("tip").hidden = true; idleT = 0; }
$("tipok").addEventListener("click", (e) => { e.stopPropagation(); hideTip(); });
$("tipgo").addEventListener("click", (e) => {
  e.stopPropagation(); hideTip();
  const b = document.querySelector('[data-tab="' + tipTab + '"]'); if (b) b.click();
});
$("tip").addEventListener("pointerdown", (e) => e.stopPropagation());
// qualquer toque ou tecla conta como ação
for (const ev of ["pointerdown", "keydown"]) document.addEventListener(ev, (e) => { if (!e.target.closest || !e.target.closest("#tip")) { idleT = 0; if (!$("tip").hidden) $("tip").hidden = true; } }, true);
function tickTip(dt) {
  if (document.querySelector(".modal")) { idleT = 0; return; }
  if (!$("tip").hidden) return;
  idleT += dt;
  if (idleT >= TIP_IDLE) showTip();
}

function loop(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now; lastTime = now / 1000;
  const speedUp = (S.cheat && S.cheat.speed) || 1;
  E.tick(S, dt * speedUp);
  checkEvents();
  tickTip(dt);
  acc += dt; saveT += dt;
  if (acc > 0.15) { refresh(); acc = 0; }
  if (saveT > 3) { save(); saveT = 0; }
  draw();
  requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); else last = performance.now(); });

Promise.all(Object.keys(IMG).map(loadImg)).then(() => {
  fitCanvas();
  load();
  seenBusts = S.busts; seenLog = S.log.length;
  renderPanel(); refresh();
  if (location.hash === "#master") openMaster();
  requestAnimationFrame(loop);
});
</script>
