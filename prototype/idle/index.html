<title>Greenhood Idle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: app de uma tela no celular — HUD (grana, Paranoia, Estamina), cena da estufa (toque),
   barra de venda e cinco abas: Estufa, Lavagem, Loja, Cidade e Perfil. */
:root{
  --bg:#1a1420; --panel:#272436; --panel-2:#352450; --line:#403d54; --well:#1f1a2b;
  --fg:#ebe9e1; --muted:#9a9bad; --leaf:#7cb342; --leaf-2:#bcd95e;
  --dirty:#f0c94f; --clean:#48a38a; --heat:#d95463; --plum:#8160a8; --sta:#6590cc;
  --display:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --num:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;overflow-x:hidden;overflow-y:auto;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.pad{position:sticky;top:0;z-index:15;background:var(--bg)}
.pad{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header{background:var(--panel);padding-block:6px 6px;display:flex;flex-direction:column;gap:4px;border-bottom:2px solid var(--bg)}
.money{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.m small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.m b{font-family:var(--num);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m.dirty b{color:var(--dirty)} .m.clean b{color:var(--clean)}
.m.lvl{text-align:right} .m.lvl b{color:#c7a6ff}
.meters{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.meter{display:grid;grid-template-columns:auto 1fr 34px;align-items:center;gap:5px;font-size:12px}
.meter span:first-child{text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter span:last-child{font-family:var(--num);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bg);border:2px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0%}
.para .bar{height:16px}
.para .bar i{background:linear-gradient(90deg,var(--clean),var(--dirty) 55%,var(--heat) 80%)}
.para .bar::after{content:"";position:absolute;top:0;bottom:0;left:60%;width:2px;background:#1a142088}
.para .bar::before{content:"";position:absolute;top:0;bottom:0;left:80%;width:2px;background:var(--heat);z-index:1}
.para span:first-child{color:#f2918a;font-weight:700}
.sta .bar i{background:var(--sta)}
.para .bar b{position:absolute;inset:0 auto 0 0;width:0;z-index:2;background:repeating-linear-gradient(135deg,#1a1420 0 3px,#6e2834 3px 6px);opacity:.85}
.status{font-size:11px;color:var(--muted);min-height:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.warn{color:var(--dirty)} .status.danger{color:var(--heat);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
#scene{position:relative;touch-action:manipulation;cursor:pointer;background:#000;flex:0 0 auto}
canvas{display:block;width:100%;image-rendering:pixelated}
#zoombtn{position:absolute;right:6px;bottom:6px;z-index:5;font-size:16px;width:36px;height:36px;background:#1a1420d9;color:#fffbef;border:2px solid #1a1420;padding:0;cursor:pointer}
.tag{position:absolute;font-size:12px;background:#1a1420d9;padding:3px 8px;border:2px solid #1a1420;pointer-events:none}
#place{left:8px;top:8px} #busy{right:8px;top:8px;color:var(--leaf-2)}
#tip{position:absolute;left:8px;right:8px;top:36px;z-index:5;display:flex;gap:8px;align-items:flex-start;background:#fffbef;color:#1a1420;border:2px solid #1a1420;box-shadow:3px 3px 0 #1a1420;padding:8px 10px;font-size:13px;line-height:1.35;cursor:default;animation:pop .25s}
#tip[hidden]{display:none}
#tip .who{font-size:26px;line-height:1}
#tip b{color:#6e2834}
#tip .acts{display:flex;gap:6px;margin-top:6px}
#tip button{background:#1a1420;color:#fffbef;padding:3px 8px;font-size:12px}
#tip button.ghost{background:none;color:#1a1420;text-decoration:underline}
#tip:after{content:"";position:absolute;left:18px;bottom:-9px;border:8px solid transparent;border-top-color:#1a1420;border-bottom:0}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#hint{left:50%;bottom:8px;transform:translateX(-50%);transition:opacity .4s;white-space:nowrap}
.sell{background:var(--panel);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.stockline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.stockline b{color:var(--leaf-2);font-family:var(--num);font-size:13px}
.sbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sb.tired{opacity:.45}
#sellhome{width:100%;padding:9px 6px} #sellhome b{font-size:15px}
#sellhome[hidden]{display:none}
.row.greyed{opacity:.45;filter:grayscale(.7)}
.sb .stc{color:#a6cbeb}
.fx{display:inline-block;padding:0 4px;margin:2px 3px 0 0;font-size:11px;font-weight:bold;border:1px solid #1a1420}
.fx.g{background:#2c6a40;color:#bcd95e} .fx.r{background:#6e2834;color:#f2918a} .fx.n{background:#272436;color:#bfbfc8}
.t .flavor{color:#cfc6b8;font-style:italic}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--dirty);outline-offset:2px}
.sb{background:var(--panel-2);border:2px solid var(--bg);box-shadow:inset 0 -3px 0 #0006;padding:5px 1px 6px;display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.15}
.sb b{font-size:13px} .sb small{font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:-.02em}
.sb small[data-r]{font-size:10px}
.sb[data-l="2"] b{color:var(--dirty)} .sb[data-l="3"] b{color:#f2918a} .sb[data-l="4"] b{color:var(--heat)}
.sb:active{transform:translateY(2px);box-shadow:none}
.sb:disabled{opacity:.4}
.cd{height:4px;background:var(--bg)} .cd i{display:block;height:100%;background:var(--leaf);width:0%}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--bg);padding-top:4px}
nav button{padding:8px 0 7px;font-size:13px;color:var(--muted);background:var(--panel);border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--fg);border-top-color:var(--leaf);background:var(--line)}
main{flex:1 0 auto;background:var(--line);padding-block:8px 20px;display:flex;flex-direction:column;gap:6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0;font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--bg);padding:6px 8px;min-width:0}
.row.sel{border-color:var(--leaf)} .row.locked{opacity:.65}
.ico{width:44px;height:44px;image-rendering:pixelated;background:#1a142088}
.emo{display:grid;place-items:center;font-size:24px}
.t{min-width:0} .t b{display:block;font-size:15px} .t small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.t .req{color:#f2918a} .t .ok{color:var(--leaf-2)}
.cashcard{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1b4a55;border:2px solid var(--clean);padding:8px 12px;margin-bottom:6px}
.cashcard span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8fd4a8}
.cashcard b{font-family:var(--num);font-size:22px;color:#8fd4a8}
.machine{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:10px}
.machine .big{font-size:13px} .machine small{color:var(--muted)}
.machine button{font-size:15px;padding:14px 16px;background:#48a38a;color:#1a1420;font-weight:bold;border:2px solid #1a1420;box-shadow:0 3px 0 #1a1420;touch-action:manipulation}
.machine button:active{transform:translateY(2px);box-shadow:0 1px 0 #1a1420}
.machine .combo{font-family:var(--num);color:var(--dirty);font-size:16px}
.machine .got{color:#8fd4a8;font-family:var(--num);min-height:18px}
canvas.spark{display:inline-block;width:72px;height:18px;vertical-align:middle;image-rendering:pixelated;margin-right:4px}
.t .good{color:#7cdc5a;font-weight:bold} .t .bad{color:#f2918a;font-weight:bold}
.t .gain{color:#7cdc5a;font-weight:bold;font-family:var(--num);font-size:13px} .t .gain2{color:#7cb342}
.t .best{background:#7cdc5a;color:#1a1420;padding:0 4px;font-size:11px;font-weight:bold}
.lv{font-family:var(--num);font-size:11px;color:var(--dirty);margin-left:6px}
.buy{background:var(--leaf);color:#14292b;font-weight:700;padding:8px 8px;min-width:86px;border:2px solid #1a1420;box-shadow:inset 0 -3px 0 #0003;font-family:var(--num);font-size:12px;white-space:nowrap}
.buy.clean{background:var(--clean);color:#0d2026} .buy.dirty{background:var(--dirty);color:#2b1a10}
.buy:disabled{background:#403d54;color:var(--muted)}
.chips{display:flex;gap:4px} .chips .buy{min-width:0;padding:7px 8px}
.card{background:var(--panel);border:2px solid var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.card p{font-size:14px;line-height:1.45;color:#d6d4cc;margin:0}
.big{font-family:var(--num);font-size:20px;color:#c7a6ff}
.prog{height:8px;background:var(--bg);border:2px solid var(--line)} .prog i{display:block;height:100%;background:var(--clean);width:0%}
.attr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.attr b{font-size:15px} .attr .v{font-family:var(--num);color:var(--dirty)} .attr small{grid-column:1/-1;color:var(--muted);font-size:12px}
.attr .prog{grid-column:1/-1}
.log{font-size:12px;color:var(--muted);line-height:1.5}
.log .batida,.log .flagrante{color:#f2918a} .log .attr{color:var(--leaf-2)} .log .lenda{color:#c7a6ff}
.danger{background:var(--plum);color:#fffbef;font-weight:700;padding:10px;border:2px solid #1a1420;font-size:15px}
.danger:disabled{background:#403d54;color:var(--muted)}
.modal{position:fixed;inset:0;background:#1a1420d0;display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:360px;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:25;background:#fffbef;color:#1a1420;border:3px solid #1a1420;padding:8px 12px;font-size:14px;max-width:92vw;box-shadow:0 4px 0 #0006;pointer-events:none}
.toast.bad{background:#f2918a}
#dlg{position:absolute;left:6px;right:6px;top:calc(100% + 4px);z-index:20;background:#fffbef;color:#1a1420;border:3px solid #1a1420;box-shadow:inset 0 0 0 2px #dccaa3,3px 3px 0 #1a1420;padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13px;line-height:1.4;cursor:pointer;min-height:64px}
#dlg[hidden]{display:none}
#dlgface{width:64px;height:64px;image-rendering:pixelated;background:#efe3c8;border:2px solid #1a1420}
#dlgface.none{display:none}
#dlgname{display:block;font-size:12px;color:#6e2834;margin-bottom:2px}
#dlgmore{position:absolute;right:8px;bottom:4px;animation:blink 1s steps(1) infinite;color:#6e2834}
#dlgact{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
#dlgact .buy{font-size:12px;padding:6px 10px;white-space:normal;text-align:left;max-width:100%}
#skip{position:absolute;right:8px;top:8px;z-index:7;font-size:11px;background:#1a1420d9;color:#fffbef;border:2px solid #1a1420;padding:3px 8px;cursor:pointer}
#skip[hidden]{display:none}
body.away .sell,body.away #panel{opacity:.25;pointer-events:none}
body.away .sell{display:none}
body.tut .sell,body.tut nav,body.tut #panel,body.tut header .meter,body.tut header .status{opacity:.12;pointer-events:none}
body.tut #hint{opacity:0}
body.tut.grow #hint{opacity:1}
#easy{right:44px;bottom:8px;color:#bcd95e;border-color:#4a8f40;pointer-events:none}
#master{left:8px;bottom:8px;color:#fff0a6;border-color:#d1952e;pointer-events:none}
.sheet{position:fixed;inset:0;background:#1a1420d0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--panel);border-top:3px solid var(--dirty);width:100%;max-width:520px;max-height:86%;overflow-y:auto;overscroll-behavior:contain;
  padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet .top b{font-size:18px;color:var(--dirty)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid button{background:var(--panel-2);border:2px solid var(--bg);padding:8px 4px;font-size:13px;line-height:1.2;box-shadow:inset 0 -3px 0 #0006}
.grid button.on{background:var(--leaf);color:#14292b;font-weight:700}
.grid button.warn{background:#6e1b3d}
.grid button:active{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.status.danger{animation:none}}
</style>

<div id="app">
  <header class="pad">
    <div class="money">
      <div class="m dirty"><small>Grana suja</small><b id="dirty">$0</b></div>
      <div class="m clean"><small>Grana limpa</small><b id="clean">$0</b></div>
      <div class="m lvl"><small>Nível</small><b id="lvl">1</b></div>
    </div>
    <div class="meters">
      <div class="meter para" title="Paranoia"><span>👁</span><div class="bar"><i id="para"></i><b id="ficha" title="Ficha na polícia"></b></div><span id="paran">0%</span></div>
      <div class="meter sta" title="Estamina"><span>⚡</span><div class="bar"><i id="sta"></i></div><span id="stan">100</span></div>
    </div>
    <div class="status" id="status"></div>
  </header>
  <div id="scene" role="button" aria-label="Tocar para fazer as plantas crescerem">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="tag" id="place">Armário Grow</div>
    <div class="tag" id="busy" hidden></div>
    <div class="tag" id="hint">toque para regar as plantas</div>
    <div class="tag" id="master" hidden>MASTER</div>
    <div class="tag" id="easy" hidden>MODO FÁCIL</div>
    <button id="skip" hidden>Pular história ⏭</button>
    <button id="zoombtn" title="Zoom no cômodo">🔍</button>
    <div id="dlg" hidden><canvas id="dlgface" width="48" height="48"></canvas><div><b id="dlgname"></b><span id="dlgtext"></span><div id="dlgact"></div></div><span id="dlgmore">▼</span></div>
    <div id="tip" hidden role="status"><div class="who" aria-hidden="true">👵</div><div><div id="tiptext"></div><div class="acts"><button id="tipgo">Ver</button><button class="ghost" id="tipok">Entendi</button></div></div></div>
  </div>
  <div id="awaybox" class="pad" hidden>
    <div class="card" style="border-color:#48a38a">
      <p>📍 Você está no <b id="awayname"></b> · volta em <b id="awaytime"></b></p>
      <p style="font-size:12px"><span id="awaytip"></span> <span id="awayze"></span></p>
      <button class="buy" id="awayleave" style="margin-top:6px;background:#403d54;color:#fffbef">Voltar agora (sem o efeito)</button>
    </div>
  </div>
  <div class="sell pad">
    <div class="stockline"><span>Estoque: <b id="units">0</b> un · vale <b id="value">$0</b></span><span id="cdtext"></span></div>
    <div class="sbtns" id="sbtns"></div>
    <button class="sb" id="sellhome" hidden><b>💰 Vender tudo pros conhecidos</b><small>preço normal · −1⚡</small></button>
    <div class="cd"><i id="cd"></i></div>
  </div>
  <nav class="pad" role="tablist">
    <button role="tab" data-tab="estufa" aria-selected="true">Estufa</button>
    <button role="tab" data-tab="lavagem" aria-selected="false">Lavagem</button>
    <button role="tab" data-tab="loja" aria-selected="false">Loja</button>
    <button role="tab" data-tab="cidade" aria-selected="false">Cidade</button>
    <button role="tab" data-tab="perfil" aria-selected="false">Perfil</button>
  </nav>
  <main class="pad" id="panel"></main>
</div>

<script>
// Economia do Greenhood Idle — o GDD inteiro adaptado para jogo idle.
// Funções puras sobre um objeto de estado: roda igual no navegador e no Node (simulação).
(function (root) {
  "use strict";

  // ---------------------------------------------------------------- catálogos
  // Sementes (números do GDD): preço (grana suja, pago a cada plantio), venda por unidade,
  // unidades por colheita, Botânica mínima, equipamentos exigidos e tempo de crescimento (s).
  // venda e semente pela metade da tabela do GDD: o lucro de cada colheita cai pela metade
  // (o jogo estava fácil demais), e cada semente continua melhor que a anterior
  const SELL_MULT = 0.5;
  const SEEDS = [
    ["Alface Mística", 5, 8, 3, 1, [], 30],
    ["Hortelã Selvagem", 10, 15, 3, 1, [], 35],
    ["Manjericão do Olimpo", 20, 30, 4, 3, [], 45],
    ["Tomate Atômico", 50, 80, 4, 4, ["regador"], 55],
    ["Pimenta do Capeta", 120, 200, 3, 5, ["regador", "termometro"], 60],
    ["Cogumelo Saltitante", 300, 500, 5, 6, ["termometro", "ventilador"], 75],
    ["Lavanda Hipnótica", 800, 1200, 4, 7, ["fertilizante", "ventilador"], 90],
    ["Cacto Cabeludo", 2000, 3500, 2, 8, ["ph", "termometro"], 100],
    ["Lótus Azul", 5000, 8000, 3, 9, ["ventilador", "ph", "fertilizante"], 120],
    ["Cipó Enrolado", 12000, 25000, 2, 10, ["filtro", "ph"], 150],
    ["Orquídea Fantasma", 30000, 60000, 2, 12, ["filtro", "led"], 180],
    ["Trufa Negra", 80000, 150000, 2, 14, ["led", "filtro", "ph"], 210],
    ["Mandrágora", 200000, 450000, 1, 16, ["led", "hidro", "filtro"], 240],
    ["Bonsai Milenar", 500000, 1.2e6, 1, 18, ["hidro", "co2", "led"], 300],
    ["Rafflesia Gigante", 1.5e6, 4e6, 1, 20, ["co2", "led", "filtro"], 360],
    ["Aurora Boreal", 5e6, 1.5e7, 1, 23, ["ia", "co2", "led"], 420],
    ["Fruto do Éden", 2e7, 6.5e7, 1, 26, ["ia", "lab"], 600],
    ["Broto de Yggdrasil", 1e8, 3.5e8, 1, 30, ["lab", "ia", "cameras", "drone"], 900],
  ].map(([name, price, sell, prod, bot, req, time], id) => ({ id, name, price: Math.ceil(price * SELL_MULT), sell: Math.round(sell * SELL_MULT), prod, bot, req, time, frame: id }));

  // Equipamentos (GDD): preço em grana limpa e bônus de produção. Cada um tem níveis
  // (o 1º libera sementes; os seguintes repetem o bônus) e um efeito extra.
  // Regras de instalação. max: níveis (5, ou 1 = compra única). keep: vai com você ao se mudar
  // (os outros ficam para trás e são comprados de novo no lugar novo). place: lugar mínimo onde cabe.
  const EQUIP_RULES = {
    regador: { max: 5, place: 0 }, tesoura: { max: 5, place: 0 }, ventilador: { max: 5, place: 1 },
    termometro: { max: 5, place: 0 }, fertilizante: { max: 5, place: 2 }, lampada: { max: 5, place: 1 },
    ph: { max: 5, place: 2 }, estufa: { max: 5, place: 2 }, drone: { max: 1, keep: true, place: 3 },
    filtro: { max: 5, place: 3 }, led: { max: 5, place: 3 }, hidro: { max: 1, keep: true, place: 6 },
    co2: { max: 5, place: 6 }, cameras: { max: 5, place: 4 }, osmose: { max: 5, place: 7 },
    ia: { max: 1, keep: true, place: 7 }, bunker: { max: 1, keep: true, place: 12, only: true },
    lab: { max: 1, keep: true, place: 12, only: true },
  };
  // saíram do jogo: lâmpada com alumínio, mini estufa, osmose reversa e kit bunker
  const REMOVED_EQUIP = ["lampada", "estufa", "osmose", "bunker"];
  const EQUIP = [
    ["regador", "Regador de garrafa PET", 100, 0.02, { speed: 0.05 }, "Cresce 5% mais rápido"],
    ["tesoura", "Tesoura enferrujada", 150, 0.02, { tap: 0.5 }, "Toque 50% mais forte"],
    ["ventilador", "Ventilador torto", 300, 0.03, {}, ""],
    ["termometro", "Termômetro na tábua", 500, 0.03, {}, ""],
    ["fertilizante", "Adubo \"El Secreto\"", 1000, 0.04, {}, ""],
    ["lampada", "Lâmpada com alumínio", 2500, 0.05, { speed: 0.1 }, "Cresce 10% mais rápido"],
    ["ph", "Medidor de pH", 5000, 0.04, {}, ""],
    ["estufa", "Mini estufa", 12000, 0.05, { speed: 0.1 }, "Cresce 10% mais rápido"],
    ["drone", "Drone de vigilância", 25000, 0.02, { calm: 0.1 }, "Vendas geram 10% menos Paranoia"],

  const R = {

  // ---------------------------------------------------------------- estado
  function newState(seed = 12345) {

  function rand(s) {
    let x = s.rng | 0;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;

  }
  function note(s, kind, text) {
    s.log.push({ t: s.time, kind, text });

  }

  // ---------------------------------------------------------------- derivados
  const lvl = (s, id) => s.equip[id] || 0;
  const fxSum = (s, key) => EQUIP.reduce((a, e) => a + (e.fx[key] || 0) * lvl(s, e.id), 0);
  const level = (s) => Math.max(1, Math.floor(Math.sqrt(s.resp / 5)));
  const legendMult = (s) => 1 + R.legendBonus * s.legend;
  // produção: soma dos bônus dos equipamentos + Botânica × 2% (GDD)
  // cidade nova: tudo vale e custa 10x mais (números maiores, mesmo ritmo), produção ×1,25 e Botânica +6 nas sementes
  const townScale = (s) => Math.pow(10, s.town || 0);
  const townProd = (s) => Math.pow(1.25, s.town || 0);
  const seedPrice = (s, i) => SEEDS[i].price * townScale(s);
  const prodMult = (s) => (1 + EQUIP.reduce((a, e) => a + e.prod * lvl(s, e.id), 0) + s.attrs.bot * 0.02) * townProd(s);
  // crescimento: tempo = base / (1 + Botânica × 5%) (GDD), mais equipamentos de velocidade
  // Modo fácil (para testar com amigos): cresce 3x mais rápido, vende 2x mais caro, tudo custa 30%,
  // atributos sobem 3x mais rápido, Paranoia cai 2x mais rápido e a espera entre vendas cai pela metade.
  const EASY = { speed: 3, price: 2, cost: 0.15, xp: 4, decay: 2, cd: 0.5, city: 0.2, tap: 3 };
  const ez = (s, k) => (s.easy ? EASY[k] : 1);
  const speed = (s) => (1 + s.attrs.bot * 0.05) * (1 + fxSum(s, "speed")) * ez(s, "speed");
  const tapPower = (s) => R.tapSeconds * speed(s) * (1 + fxSum(s, "tap")) * ez(s, "tap");
  const priceMult = (s, lvlIdx) => (1 + s.attrs.lab * 0.02) * (1 + (s.place >= PARA_FROM ? SALES[lvlIdx].bonus : 0)) * legendMult(s) * (1 + (level(s) - 1) * 0.01) * ez(s, "price") * townScale(s);
  // A Paranoia entra aos poucos: em casa (Armário e Quartinho) ninguém repara; da Garagem em diante ela
  // existe (sobe, cai, tem flagrante); a polícia só faz ronda e batida a partir do Porão.
  const PARA_FROM = 2, RAID_FROM = 3;
  const paraActive = (s) => s.place >= PARA_FROM;
  const raidsActive = (s) => s.place >= RAID_FROM;
  const riskOf = (s, lvlIdx) => !paraActive(s) ? 0 : Math.max(0, SALES[lvlIdx].risk - s.attrs.fur * 0.004) * (1 + 0.1 * (s.town || 0));
  const paraOf = (s, lvlIdx) => !paraActive(s) ? 0 : SALES[lvlIdx].para * Math.max(0.2, 1 - fxSum(s, "calm") - s.attrs.fur * 0.01);
  const saleSta = (s, lvlIdx) => staCost(s, s.place >= PARA_FROM ? SALES[lvlIdx].sta : 1);
  const staCost = (s, base) => (s.para >= 60 ? base * 2 : base);
  const maxPots = (s) => PLACES[s.place].pots;
  // vaso novo: segue o preço do lugar onde você está, subindo a cada vaso comprado ali.
  // Assim encher o cômodo custa parecido em todo lugar, em vez de explodir no fim do jogo.
  const POT_MIN = 100, POT_SHARE = 0.13, POT_GROW = 1.3; // vaso: 13% do lugar (mín. $100), +30% a cada vaso ali
  const potCost = (s) => {
    const prev = s.place > 0 ? PLACES[s.place - 1].pots : 0;
    const base = Math.max(POT_MIN, PLACES[s.place].cost * POT_SHARE) * townScale(s);
    return Math.round(base * Math.pow(POT_GROW, Math.max(0, s.pots.length - Math.max(1, prev))) * ez(s, "cost"));
  };
  const equipCost = (s, e) => Math.round(e.price * Math.pow(EQUIP_LEVEL_MULT, lvl(s, e.id)) * ez(s, "cost") * townScale(s));
  const placeCost = (s, i = s.place + 1) => (PLACES[i] ? Math.round(PLACES[i].cost * ez(s, "cost") * townScale(s)) : Infinity);
  const saleCooldown = (s) => Math.max(3, 20 - 17 * (topStockSeed(s) / (SEEDS.length - 1))) * Math.max(0.4, 1 - s.attrs.lab * 0.01) * ez(s, "cd");
  const stockUnits = (s) => s.stock.reduce((a, b) => a + b, 0);
  const stockValue = (s) => s.stock.reduce((a, n, i) => a + n * SEEDS[i].sell, 0);
  function topStockSeed(s) {
    for (let i = SEEDS.length - 1; i >= 0; i--) if (s.stock[i] > 0) return i;
    return 0;
  }

  // algumas sementes pedem nível do jogador (Respeito), não Botânica: a Hortelã chega no Nível 2
  const SEED_LEVEL = { 1: 2 };
  function seedLocked(s, seed) {
    const why = [];
    const bot = seed.bot + 6 * (s.town || 0);
    if (s.attrs.bot < bot) why.push(`Botânica ${bot}`);
    const nv = SEED_LEVEL[seed.id];
    if (nv && level(s) < nv) why.push(`Nível ${nv}`);
    for (const r of seed.req) if (!lvl(s, r)) why.push(EQUIP.find((e) => e.id === r).name);
    return why;
  }
  const seedOk = (s, i) => seedLocked(s, SEEDS[i]).length === 0;

  // Renda estimada (grana suja/s) se tudo for vendido no Discreto.
  function incomePerSec(s) {
    let total = 0;
    for (const p of s.pots) {
      const seed = SEEDS[p.s];
      const per = (seed.prod * prodMult(s) * seed.sell * priceMult(s, 0) - seedPrice(s, p.s)) / (seed.time / speed(s));
      total += Math.max(0, per);
    }
    return total;
  }

  // ---------------------------------------------------------------- plantio
  // sementes e vasos: paga com grana suja; se faltar, completa com a limpa (limpa compra tudo)
  const canPay = (s, c) => s.dirty + s.clean >= c;
  function pay(s, c) { const d = Math.min(s.dirty, c); s.dirty -= d; s.clean -= c - d; }
  function plant(s, pot) {
    const seed = SEEDS[pot.s];
    if (!canPay(s, seedPrice(s, pot.s)) || !seedOk(s, pot.s)) { pot.on = false; return false; }
    pay(s, seedPrice(s, pot.s));
    pot.on = true;
    pot.g = 0;
    return true;
  }

  function harvest(s, pot) {
    const seed = SEEDS[pot.s];
    const units = Math.max(1, Math.floor(seed.prod * prodMult(s)));
    s.stock[pot.s] += units;
    s.resp += 1;
    gainXp(s, "bot", 1);
    pot.s = s.seed; // replanta com a semente escolhida
    return units;
  }

  function growAll(s, seconds) {
    let n = 0;
    for (const p of s.pots) {
      if (!p.on && !plant(s, p)) continue;
      p.g += seconds;
      const t = SEEDS[p.s].time;
      while (p.g >= t) {
        const carry = p.g - t;
        n += harvest(s, p) ? 1 : 0;
        if (!plant(s, p)) { p.g = 0; break; }
        p.g = Math.min(carry, SEEDS[p.s].time * 0.99);
      }
    }
    return n;
  }

  // ---------------------------------------------------------------- atributos
  const XP_NEED = {
    bot: (l) => 20 * Math.pow(l, 1.8),
    lab: (l) => 40 * Math.pow(l, 1.8),
    fur: (l) => 6 * Math.pow(l, 1.8),
    seg: (l) => 10 * Math.pow(l, 1.8),
  };
  function gainXp(s, k, amt) {
    s.xp[k] += amt * ez(s, "xp");
    while (s.xp[k] >= XP_NEED[k](s.attrs[k])) {
      s.xp[k] -= XP_NEED[k](s.attrs[k]);
      s.attrs[k]++;
      note(s, "attr", `+1 ${ATTRS[k]} (agora ${s.attrs[k]})`);
    }
  }

  // ---------------------------------------------------------------- ações
  function tap(s) {
    if (s.city) return 0;
    return growAll(s, tapPower(s));
  }

  // Ações (fora a venda) que levariam a Paranoia a 100% são bloqueadas: só a venda é aposta.
  const safe = (s, add) => s.para + add < 100;

  function sell(s, lvlIdx, auto = false) {
    if (s.city && !auto) return null; // fora de casa: só o Zé vende
    if (s.saleCd > 0 || stockUnits(s) <= 0) return null;
    const L = SALES[lvlIdx];
    if (!auto) {
      const sc = saleSta(s, lvlIdx);
      if (s.sta < sc) return null;
      s.sta -= sc;
    }
    // vende a fatia do estoque (no mínimo 1 unidade), começando pelas plantas mais valiosas
    let left = Math.max(1, Math.ceil(stockUnits(s) * L.pct)), units = 0, value = 0;
    for (let i = SEEDS.length - 1; i >= 0 && left > 0; i--) {
      const q = Math.min(left, s.stock[i]);
      if (q <= 0) continue;
      s.stock[i] -= q; left -= q; units += q; value += q * SEEDS[i].sell;
    }
    s.saleCd = saleCooldown(s);
    if (!(s.cheat && s.cheat.noPolice) && rand(s) < riskOf(s, lvlIdx)) {
      // flagrante: perde a mercadoria, multa na grana suja, +Paranoia
      const fine = s.dirty * Math.max(0.05, 0.25 - s.attrs.seg * 0.01);
      s.dirty -= fine;
      s.sta = Math.max(0, s.sta - 20);
      s.resp = Math.max(0, s.resp - 5);
      s.para += 15;
      s.timesArrested++;
      note(s, "flagrante", `Flagrante! Perdeu ${units} unidades e $${Math.round(fine)} de multa.`);
      checkBust(s);
      return { units, money: 0, caught: true };
    }
    const money = Math.floor(value * priceMult(s, lvlIdx));
    s.dirty += money;
    s.runEarned += money;
    s.para += paraOf(s, lvlIdx);
    s.resp += Math.ceil(units / 3);
    gainXp(s, "lab", Math.sqrt(units) * (lvlIdx + 1));   // raiz: vender muito não dispara a Lábia
    if (lvlIdx >= 1) gainXp(s, "fur", lvlIdx);
    checkBust(s);
    return { units, money, caught: false };
  }

  // Mercado: a taxa do crypto e dos NFTs sobe e desce (ciclos de ~10 min e ~3 min).
  function marketMult(id, t) {
    const ph = id === "nft" ? 2.1 : 0;
    const m = 1 + 0.55 * Math.sin((2 * Math.PI * t) / 600 + ph) + 0.2 * Math.sin((2 * Math.PI * t) / 170 + ph * 1.7);
    return Math.max(0.3, Math.min(1.8, m));
  }
  const marketFee = (s, id, t = s.time) => {
    const m = LAUNDRY.find((x) => x.id === id);
    return id === "crypto" || id === "nft" ? Math.min(0.9, m.fee * marketMult(id, t)) : m.fee;
  };
  // reserva para replantar: fachadas e maquininha não encostam nela
  const reserve = (s) => Math.max(30, seedPrice(s, s.seed) * s.pots.length * 3);
  const frontLvl = (s, id) => (s.fronts && s.fronts[id]) || 0;
  const frontCost = (s, f) => Math.round(f.cost * Math.pow(2.5, frontLvl(s, f.id)) * ez(s, "cost") * townScale(s));
  const frontCap = (f, l, s) => (l ? f.cap * Math.pow(1.7, l - 1) * (s ? townScale(s) : 1) : 0); // $/min
  function buyFront(s, id) {
    if (s.city) return false;
    const f = FRONTS.find((x) => x.id === id);
    if (frontLvl(s, id) >= FRONT_MAX) return false;
    const c = frontCost(s, f);
    if (s.clean < c) return false;
    s.clean -= c;
    s.fronts[id] = frontLvl(s, id) + 1;
    return true;
  }
  const frontOpen = (s, id) => !(s.closed && s.closed[id] > s.time) && !(s.fiscal && s.fiscal.id === id);
  function runFronts(s, dt) {
    let avail = Math.max(0, s.dirty - reserve(s)), active = 0;
    for (const f of FRONTS) {
      const l = frontLvl(s, f.id);
      if (!l || !frontOpen(s, f.id) || avail <= 0) continue;
      const amt = Math.min(avail, (frontCap(f, l, s) / 60) * dt);
      avail -= amt; s.dirty -= amt;
      s.clean += amt * (1 - f.fee);
      active++;
    }
    if (active) s.para += active * R.frontPara * dt;
    return active;
  }
  // Fiscal da Receita: aparece numa fachada que está lavando
  function fiscalCheck(s, dt) {
    if (s.fiscal) {
      if (s.time - s.fiscal.at > 120) fiscalClose(s, true); // ninguém respondeu: fecha sozinha
      return;
    }
    s.fiscalT += dt;
    if (s.fiscalT < R.fiscalEvery) return;
    s.fiscalT = 0;
    const open = FRONTS.filter((f) => frontLvl(s, f.id) && frontOpen(s, f.id));
    if (!open.length || s.dirty <= reserve(s) || rand(s) > R.fiscalChance) return;
    const f = open[open.length - 1]; // a maior chama mais atenção
    const bribe = Math.round(frontCap(f, frontLvl(s, f.id), s) * 8 * Math.max(0.5, 1 - s.attrs.lab * 0.01));
    s.fiscal = { id: f.id, at: s.time, bribe };
    note(s, "fiscal", `Fiscal da Receita na ${f.name}!`);
  }
  function fiscalBribe(s) {
    if (!s.fiscal || s.clean < s.fiscal.bribe) return false;
    s.clean -= s.fiscal.bribe;
    note(s, "city", "O fiscal pegou o envelope e foi embora.");
    s.fiscal = null;
    return true;
  }
  function fiscalClose(s, auto) {
    if (!s.fiscal) return false;
    s.closed[s.fiscal.id] = s.time + R.fiscalClose;
    note(s, "city", auto ? "Ninguém atendeu o fiscal: a fachada ficou fechada por 15 min." : "Você fechou a fachada por 15 min até a poeira baixar.");
    s.fiscal = null;
    return true;
  }
  function fiscalRisk(s) {
    if (!s.fiscal) return null;
    s.fiscal = null;
    if (rand(s) < 0.5 + s.attrs.lab * 0.005) { note(s, "city", "Você enrolou o fiscal. Passou!"); return true; }
    const fine = Math.round(s.clean * 0.3);
    s.clean -= fine;
    s.para += 20;
    note(s, "flagrante", `O fiscal não engoliu: multa de $${fine} e +20 Paranoia.`);
    checkBust(s);
    return false;
  }
  // Maquininha de contar notas: lava sem taxa, mas cansa. Combo de 1 a 3 (cada toque rápido soma +0,25).
  const BILL_MAX = 3;
  const billValue = (s) => Math.max(10, incomePerSec(s) * 1.5);
  function countBills(s, combo) {
    if (s.city) return 0;
    const cost = staCost(s, R.billSta);
    if (s.sta < cost) return 0;
    const amt = Math.min(Math.max(0, s.dirty - reserve(s)), billValue(s) * Math.max(1, Math.min(BILL_MAX, combo)));
    if (amt < 1) return 0;
    if (!safe(s, R.billPara)) return 0;
    s.sta -= cost;
    s.dirty -= amt; s.clean += amt;
    s.para += R.billPara;
    return amt;
  }

  function launder(s, methodId, fraction) {
    if (s.city) return false;
    const m = LAUNDRY.find((x) => x.id === methodId);
    if (s.attrs.lab < m.lab) return false;
    const amount = Math.floor(s.dirty * fraction);
    if (amount < 1) return false;
    s.dirty -= amount;
    if (!safe(s, m.para)) return false;
    const net = Math.floor(amount * (1 - marketFee(s, methodId)));
    s.para += m.para;
    if (m.time === 0) s.clean += net;
    else s.laundry.push({ id: m.id, net, done: s.time + m.time });
    checkBust(s);
    return true;
  }

  // por que não dá para comprar agora ("" = pode)
  function equipBlock(s, e) {
    if (lvl(s, e.id) >= e.max) return e.max === 1 ? "Já instalado" : "Nível máximo";
    if (s.place < e.place) return e.only ? `Só no ${PLACES[e.place].name}` : `Não cabe no ${PLACES[s.place].name} · precisa de ${PLACES[e.place].name}`;
    return "";
  }
  function bestSeed(s) { for (let i = SEEDS.length - 1; i >= 0; i--) if (seedOk(s, i)) return i; return 0; }
  function buyEquip(s, id) {
    if (s.city) return false;
    const e = EQUIP.find((x) => x.id === id);
    if (equipBlock(s, e)) return false;
    const c = equipCost(s, e);
    if (s.clean < c) return false;
    s.clean -= c;
    s.equip[id] = lvl(s, id) + 1;
    return true;
  }
  // freio: quem se muda toda hora chama atenção. Só dá para sair depois de um tempo no lugar atual
  // (Quartinho 15 min, Garagem 20, Porão 25... até 1h; conta também com o app fechado)
  const placeWork = (s) => (s.place === 0 ? 0 : Math.min(3600, 600 + 300 * s.place) * ez(s, "city"));
  const placeWorkLeft = (s) => (s.cheat && s.cheat.on ? 0 : Math.max(0, placeWork(s) - (s.placeT || 0)));
  const HOME_PLACE = 1; // o Quartinho é da sua casa: aceita grana suja
  const placeNeedsClean = (s, i = s.place + 1) => i !== HOME_PLACE;
  function buyPlace(s) {
    if (s.city) return false;
    const next = PLACES[s.place + 1];
    const pc = placeCost(s);
    if (!next || placeWorkLeft(s) > 0) return false;
    if (s.place + 1 === HOME_PLACE) { if (!canPay(s, pc)) return false; pay(s, pc); }
    else { if (s.clean < pc) return false; s.clean -= pc; }
    s.place++;
    // lugar novo, ninguém conhece: a Paranoia zera (até o piso da ficha na polícia) e a ronda recomeça
    s.para = s.ficha || 0;
    s.raidT = 0;
    s.placeT = 0;
    // os equipamentos do lugar antigo ficam para trás; só os de compra única vêm junto
    for (const e of EQUIP) if (!e.keep) delete s.equip[e.id];
    if (!seedOk(s, s.seed)) s.seed = bestSeed(s);
    return true;
  }
  function buyPot(s) {
    if (s.city) return false;
    if (s.pots.length >= maxPots(s)) return false;
    const c = potCost(s);
    if (!canPay(s, c)) return false;
    pay(s, c);
    s.pots.push({ g: 0, s: s.seed, on: false });
    return true;
  }
  function chooseSeed(s, i) {
    if (!seedOk(s, i)) return false;
    s.seed = i;
    // vasos vazios ou parados trocam já; os que estão crescendo trocam na próxima colheita
    for (const p of s.pots) if (!p.on || p.g === 0) { p.s = i; p.on = false; }
    return true;
  }
  function hireZe(s) {
    if (s.ze || s.clean < R.zeCost) return false;
    s.clean -= R.zeCost;
    s.ze = true;
    return true;
  }
  // a cidade cobra conforme a sua fama: +10% por nível (nível 1 = preço da tabela)
  const cityCost = (s, a) => Math.round(a.cost * Math.pow(1.1, Math.max(0, level(s) - 1)) * ez(s, "cost") * townScale(s));
  function startCity(s, id) {
    const a = CITY.find((x) => x.id === id);
    if (s.city) return false;
    const cost = staCost(s, a.sta);
    const price = cityCost(s, a);
    if (s.clean < price || s.sta < cost) return false;
    if (a.fx.para > 0 && !safe(s, a.fx.para)) return false;
    s.clean -= price;
    s.sta -= cost;
    const dur = a.time * ez(s, "city");
    s.city = { id, end: s.time + dur, dur };
    return true;
  }
  // cada toque adianta um pouquinho, como regar as plantas (2x o toque de rega): tocando sem parar,
  // o tempo passa ~3-4x mais rápido
  const cityTrains = (id) => { const fx = CITY.find((x) => x.id === id).fx; return !!(fx.bot || fx.lab || fx.fur || fx.seg); };
  function cityTap(s) {
    if (!s.city || cityTrains(s.city.id)) return 0;            // treino não tem atalho
    const cut = R.tapSeconds * 2 * ez(s, "tap");
    s.city.end -= cut;
    return cut;
  }
  // voltar antes da hora: sem o efeito da atividade
  function leaveCity(s) { if (!s.city) return false; s.city = null; return true; }
  function finishCity(s) {
    const a = CITY.find((x) => x.id === s.city.id);
    const fx = a.fx;
    if (fx.sta) s.sta = Math.min(100, s.sta + fx.sta);
    if (fx.para) s.para = Math.max(s.ficha || 0, s.para + fx.para);
    if (fx.resp) s.resp += fx.resp;
    for (const k of ["bot", "lab", "fur", "seg"]) if (fx[k]) gainXp(s, k, XP_NEED[k](s.attrs[k]) * 0.25 * fx[k]);
    note(s, "city", `${a.name}: pronto!`);
    s.city = null;
    checkBust(s);
  }
  function beg(s) {
    if (s.city) return 0;
    const cost = staCost(s, 3 + Math.floor(rand(s) * 6));
    if (s.sta < cost) return 0;
    s.sta -= cost;
    const got = 1 + Math.floor(rand(s) * 3);
    s.clean += got; // esmola é dinheiro limpo
    return got;
  }
  function visitAvo(s) {
    if (s.city) return false;
    if (s.time < s.avoT || !safe(s, 10)) return false;
    s.avoT = s.time + R.avoEvery;
    s.sta = Math.min(100, s.sta + 15);
    s.clean += 5; // o dinheiro da Vó é limpinho
    s.para += 10;
    if (rand(s) < 0.3) { s.clean += seedPrice(s, s.seed) * 2; note(s, "avo", "A Vó deu um dinheirinho pras sementes!"); }
    checkBust(s);
    return true;
  }
  function borrow(s) {
    if (s.city) return false;
    if (s.debt > 0 || !safe(s, 30)) return false;
    s.dirty += R.loan;
    s.debt = R.loanBack;
    s.para += 30;
    checkBust(s);
    return true;
  }
  function repay(s) {
    if (s.debt <= 0 || s.dirty < s.debt) return false;
    s.dirty -= s.debt;
    s.debt = 0;
    return true;
  }

  // ---------------------------------------------------------------- batida e Lenda
  // Lenda = (log10(ganho) − 4)²: $100 mil = 1, $10 mi = 9, $10 bi = 36, $10 tri = 81
  const legendFor = (earned) => (earned < 1e5 ? 0 : Math.floor(Math.pow(Math.log10(earned) - 4, 2)));

  function checkBust(s) {
    if (!paraActive(s)) { s.para = 0; return; }
    if ((s.cheat && s.cheat.noPolice) || !raidsActive(s)) { s.para = Math.min(s.para, 99); return; }
    if (s.para >= 100) bust(s, "A Paranoia chegou a 100%.");
  }
  // Batida: perde TUDO (grana suja e limpa, estoque, equipamentos, imóveis) e volta ao Armário.
  // Fica só o que é do personagem: atributos, Respeito e Lenda (+ metade da Lenda da rodada).
  function bust(s, why, force = false) {
    if (!s.warned && !force) {                                     // a primeira vez é só um susto
      s.warned = true;
      s.para = 50;
      s.raidT = 0;
      s.lastWarn = { why, at: s.time };
      note(s, "aviso", "A Dona Cleide te pegou no flagra. Da próxima vez ela conta tudo pra Vó.");
      return;
    }
    const gain = Math.floor(legendFor(s.runEarned / townScale(s)) / 2);
    note(s, "batida", `${why} Batida policial! +${gain} Lenda.`);
    const ficha = Math.min(R.fichaMax, (s.ficha || 0) + R.fichaStep);
    const keep = { legend: s.legend + gain, attrs: { ...s.attrs }, timesArrested: s.timesArrested + 1, ficha, fichaLenda: s.legend + gain };
    reset(s, keep);
    s.para = ficha; // sai da delegacia fichado
    s.dirty = 15 * s.legend; // sai da delegacia só com a roupa do corpo (a Lenda ajuda um pouco)
    s.clean = 0;
    s.busts++;
    s.lastBust = { why, gain, kept: 0 };
  }
  // Advogado: baixa a ficha em 10 na hora. Fica 10x mais caro a cada 10% de ficha.
  const lawyerCost = (s) => Math.round(1000 * Math.pow(10, (s.ficha || 0) / 10) * ez(s, "cost") * townScale(s));
  function lawyer(s) {
    if (s.city) return false;
    if (!s.ficha) return false;
    const c = lawyerCost(s);
    if (s.clean < c) return false;
    s.clean -= c;
    s.ficha = Math.max(0, s.ficha - 10);
    note(s, "city", `O advogado limpou parte da sua ficha: agora ${s.ficha}%.`);
    return true;
  }
  // responde a Vó com a explicação k (0 ou 1); devolve o que aconteceu
  function surpriseAnswer(s, k) {
    if (!s.surprise) return null;
    const o = SURPRISE[s.surprise.opts[k]];
    s.surprise = null;
    if (o.kind === "bust") {
      if (s.cheat && s.cheat.noPolice) return { ...o, kind: "safe", res: o.res + " (Imune à polícia: escapou.)" };
      bust(s, "A Vó fez uma visita surpresa e descobriu tudo.", true);
    } else if (o.kind === "para") s.para = Math.max(s.para, 90);
    else {
      if (o.sta) s.sta = Math.min(100, s.sta + o.sta);
      if (o.bot) gainXp(s, "bot", XP_NEED.bot(s.attrs.bot) * 0.5);
    }
    return o;
  }
  // ---- encomendas
  function newOrder(s) {
    const best = bestSeed(s);
    const seed = Math.max(0, best - Math.floor(rand(s) * 3));
    const per = Math.max(1, Math.floor(SEEDS[seed].prod * prodMult(s)));
    const n = Math.max(3, Math.round(per * s.pots.length * (0.8 + rand(s) * 1.4)));
    const pay = Math.round(n * SEEDS[seed].sell * priceMult(s, 0) * (2 + rand(s)));
    const c = CLIENTS[Math.floor(rand(s) * CLIENTS.length)];
    s.orders.push({ id: ++s.orderN, emoji: c[0], who: c[1], seed, n, pay, until: s.time + R.orderTime });
    note(s, "order", `${c[1]} quer ${n} un de ${SEEDS[seed].name}.`);
  }
  function ordersTick(s, dt) {
    if (!s.orders) s.orders = [];
    for (let i = s.orders.length - 1; i >= 0; i--) {
      if (s.time > s.orders[i].until) { const o = s.orders.splice(i, 1)[0]; s.resp = Math.max(0, s.resp - 1); note(s, "order", `${o.who} cansou de esperar. −1 Respeito.`); }
    }
    if (s.away || (s.tut != null && s.tut < 99) || s.place < ORDERS_FROM) return;
    s.orderT = (s.orderT || 0) + dt;
    if (s.orderT >= R.orderEvery && s.orders.length < R.orderMax) { s.orderT = 0; newOrder(s); }
  }
  function deliver(s, id) {
    if (s.city) return false;
    const i = s.orders.findIndex((o) => o.id === id);
    if (i < 0) return false;
    const o = s.orders[i];
    if (s.stock[o.seed] < o.n) return false;
    s.stock[o.seed] -= o.n;
    s.dirty += o.pay; s.runEarned += o.pay;
    s.resp += 2; s.para += 3;
    gainXp(s, "lab", Math.sqrt(o.n));
    s.orders.splice(i, 1);
    note(s, "order", `Entregou para ${o.who}: +$${Math.round(o.pay)}.`);
    checkBust(s);
    return true;
  }
  // ---- mudar de cidade (o jogo sem fim)
  const TOWNS_ON = false; // mudar de cidade: desligado até esta versão ficar redonda
  const canMoveTown = (s) => TOWNS_ON && s.place === PLACES.length - 1 && seedOk(s, SEEDS.length - 1);
  function moveTown(s) {
    if (!canMoveTown(s)) return 0;
    const gain = Math.max(1, legendFor(s.runEarned / townScale(s)));
    const town = (s.town || 0) + 1;
    note(s, "lenda", `Mudou para ${townName(town)}: produção ×${Math.pow(1.25, town).toFixed(2).replace(".", ",")} e +${gain} Lenda.`);
    reset(s, { legend: s.legend + gain, attrs: { ...s.attrs }, town });
    return gain;
  }

  function retire(s) {
    const gain = legendFor(s.runEarned / townScale(s));
    if (gain < 1) return 0;
    note(s, "lenda", `Passou o ponto: +${gain} Lenda.`);
    reset(s, { legend: s.legend + gain, attrs: { ...s.attrs } });
    return gain;
  }
  function reset(s, keep) {
    const persist = { time: s.time, rng: s.rng, log: s.log, busts: s.busts, timesArrested: s.timesArrested, resp: s.resp, xp: s.xp, cheat: s.cheat, easy: s.easy, warned: s.warned, town: s.town || 0, ficha: s.ficha || 0, fichaLenda: s.fichaLenda || 0 };
    Object.assign(s, newState(), persist, keep);
    s.attrs.bot = Math.max(s.attrs.bot, 1);
    // Lenda dá um empurrão inicial: começa com mais grana suja
    s.dirty = 20 + 25 * s.legend;
  }

  // ---------------------------------------------------------------- tempo
  function tick(s, dt) {
    s.time += dt;
    s.placeT = (s.placeT || 0) + dt;
    s.saleCd = Math.max(0, s.saleCd - dt);
    s.sta = Math.min(100, s.sta + R.staRegen * dt);
    const decay = s.para < R.paraCalm ? R.paraDecayLow : R.paraDecay;   // até 40% a cabeça esfria rápido
    s.para = Math.max(s.ficha || 0, s.para - decay * ez(s, "decay") * dt + (s.debt > 0 ? R.loanPara * dt : 0));
    if (!paraActive(s)) s.para = 0;
    // ficha limpa aos poucos: a cada 5 de Lenda ganhos depois da última batida
    while (s.ficha > 0 && s.legend >= s.fichaLenda + R.fichaLenda) {
      s.ficha = Math.max(0, s.ficha - 5); s.fichaLenda += R.fichaLenda;
      note(s, "lenda", `Sua fama limpou a ficha: a Paranoia agora pode cair até ${s.ficha}%.`);
    }
    growAll(s, dt * speed(s));
    for (let i = s.laundry.length - 1; i >= 0; i--) {
      if (s.time >= s.laundry[i].done) { s.clean += s.laundry[i].net; s.laundry.splice(i, 1); }
    }
    if (s.city && s.time >= s.city.end) finishCity(s);
    runFronts(s, dt);
    fiscalCheck(s, dt);
    ordersTick(s, dt);
    if (!s.away && !s.surprise && s.time > 600 && !(s.tut < 99) && raidsActive(s)) {
      s.surpT += dt;
      if (s.surpT >= R.surpriseEvery) {
        s.surpT = 0;
        if (rand(s) < R.surpriseChance) {
          const a = Math.floor(rand(s) * SURPRISE.length);
          let b = Math.floor(rand(s) * (SURPRISE.length - 1)); if (b >= a) b++;
          s.surprise = { opts: [a, b], at: s.time };
        }
      }
    }
    if (s.ze) {
      s.zeT += dt;
      if (s.zeT >= R.zeEvery) {
        s.zeT = 0;
        const cd = s.saleCd; s.saleCd = 0;
        if (s.para + paraOf(s, 0) <= R.zeMaxPara) sell(s, 0, true);   // o Zé é cuidadoso: com a Paranoia alta, ele espera
        s.saleCd = Math.max(cd, 0);
      }
    }
    // batida periódica: a cada 5 min, com Paranoia acima de 80, 50% de chance
    s.raidT += dt;
    if (s.raidT >= R.raidEvery) {
      s.raidT = 0;
      const raid = R.raidChance * (1 - Math.min(0.6, fxSum(s, "guard") + s.attrs.seg * 0.005));
      if (!(s.cheat && s.cheat.noPolice) && raidsActive(s) && s.para > R.raidAt && rand(s) < raid) bust(s, "A polícia fez uma ronda e achou o esconderijo.");
    }
    checkBust(s);
  }

  // Com o app fechado: avança em passos de 5 s (até 8 h).
  function offline(s, seconds) {
    const t = Math.min(seconds, R.offlineCap);
    s.away = true; // a Vó não aparece com o jogo fechado
    const before = { dirty: s.dirty, clean: s.clean, units: stockUnits(s), resp: s.resp };
    const busts = s.busts;
    let left = t;
    while (left > 0) { const d = Math.min(5, left); tick(s, d); left -= d; }
    s.away = false;
    return {
      seconds: t,
      dirty: s.dirty - before.dirty, clean: s.clean - before.clean,
      units: stockUnits(s) - before.units, resp: s.resp - before.resp,
      busted: s.busts > busts,
    };
  }

  const api = {
    SEEDS, EQUIP, PLACES, SALES, LAUNDRY, CITY, ATTRS, R,

  const ROOM = {}; const STEP = new Map();           // cor -> [um degrau abaixo, um acima] na rampa
  const OL = 0x1a1420;
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; };
  function registerRooms(map, shift) {
    for (const k in shift) STEP.set(parseInt(k.slice(1), 16), shift[k].map((h) => parseInt(h.slice(1), 16)));

        r.lm = new Int8Array(li.width * li.height);
        for (let i = 0; i < r.lm.length; i++) r.lm[i] = Math.round(d[i * 4] / 64) - 2;

  function litSprite(r, it) {

    let c = r.lit.get(k);

    if (!r.lm || !raw.data) return raw;
    const { w, h } = it, src = raw.data.data, W0 = r.meta.w;
    c = mk(w, h); const x = c.getContext("2d"), out = x.createImageData(w, h), o = out.data;
    const [lx] = r.meta.light, cx = it.x + w / 2, dx = lx > cx + 8 ? 1 : lx < cx - 8 ? -1 : 0;
    const op = (sx, sy) => sx >= 0 && sy >= 0 && sx < w && sy < h && src[(sy * w + sx) * 4 + 3] > 0 &&
      ((src[(sy * w + sx) * 4] << 16) | (src[(sy * w + sx) * 4 + 1] << 8) | src[(sy * w + sx) * 4 + 2]) !== OL;

const E = window.ECON;
const SAVE_KEY = "greenhood-idle-v2";
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- formatação
function fmt(n) {
  if (!isFinite(n)) return "∞";
  const neg = n < 0; n = Math.abs(n);
  let out;
  if (n < 1000) out = Math.floor(n).toString();
  else {
    // depois de "dec", sufixos de letras como nos jogos idle: aa, ab, ac... (mudar de cidade multiplica tudo por 10)
    const u = ["mil", "mi", "bi", "tri", "qua", "qui", "sex", "sep", "oct", "non", "dec"];
    for (let a = 0; a < 26; a++) for (let b = 0; b < 26; b++) u.push(String.fromCharCode(97 + a) + String.fromCharCode(97 + b));
    let i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    out = (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)).replace(".", ",") + " " + u[i];
  }
  return (neg ? "-" : "") + out;
}
const $$ = (n) => "$" + fmt(n);
const pct = (x) => Math.round(x * 100) + "%";
function dur(t) {
  t = Math.max(0, Math.ceil(t));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}h${String(m).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}

//   garrafa PET e medidor de pH: enfiados no vaso · tesoura: podando uma planta · ventilador: no chão, virado
//   para as plantas, mexendo a cabeça · termômetro: pequeno, na parede · adubo: sacos empilhados (1 por nível)
//   filtro de carbono: com duto entrando na parede · CO2: ao lado do filtro, ligado por uma mangueira, soltando gás
//   painel LED: barra roxa pendurada sobre as plantas · câmera: no canto, varrendo a sala · drone: voando

const hitR = (a, b) => !(a[2] <= b[0] || a[0] >= b[2] || a[3] <= b[1] || a[1] >= b[3]);

function findSlots(m, busy) {
  const sig = S.place + "|" + busy.map((r) => r.join(",")).join(";");
  if (slotCache.sig === sig) return slotCache.slots;
  const [x0, y0, w, h] = m.room, fy = m.floor, [ax, ay, aw, ah] = m.pots, cx = ax + aw / 2, cy = ay + ah / 2;
  const cands = [];
  for (let y = fy - 14; y <= y0 + h - 28; y += 2) for (let x = x0 + 2; x <= x0 + w - 26; x += 2) {
    const body = [x + 2, y + 4, x + 22, y + 26];
    if (busy.some((b) => hitR(body, b))) continue;
    const d = Math.max(Math.abs(x + 12 - cx) - aw / 2, 0) + Math.max(Math.abs(y + 22 - cy) - ah / 2, 0) * 1.4;
    cands.push([d, x, y]);
  }
  cands.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [, x, y] of cands) {
    if (out.every(([a, b]) => !hitR([x, y + 2, x + 24, y + 26], [a, b + 2, a + 24, b + 26]))) out.push([x, y]);
    if (out.length >= 12) break;

      if (stagePrev[i] !== undefined && stagePrev[i] !== sk && st) { stagePop[i] = lastTime; sfx("pop", null, 0.08); }
      stagePrev[i] = sk;
      // garrafa PET (se comprada) faz parte do sprite do vaso: ganha a luz e a profundidade da cena
      const pet = E.lvl(S, "regador") > 0 ? petWater(f) : -1, flip = i % 2 === 1;
      const ph = i === 0 && E.lvl(S, "ph") > 0;
      items.push({ x, y: y - 34, w: 32, h: 58, foot: 2, dy: hop(i), key: pf + ":" + (st ? st.join(",") : "-") + ":" + pet + (flip ? "f" : "") + (ph ? "ph" : ""),
        paint(c) {
          if (sprites.vasos) c.drawImage(sprites.vasos, pf * 32, 0, 32, 24, 0, 34, 32, 24);
          paintPlant(st)(c);
          if (pet >= 0) drawPet(c, 16 + (flip ? -7 : 7), 38, pet, flip);
          if (ph) drawPh(c, 16 + (flip ? 8 : -8), 38, !flip);
        } });
      marks.push({ on: p.on, f, x: x + 16, top: y - 25, bar: [x + 8, y + 22, 16], pot: true, flip: i % 2 === 1 });
      if (!first) first = { x, y: y - 34 };
    });
  }
  lastMarks = marks;
  // a cena acende cada sprite pelo mapa de luz e projeta a sombra
  // equipamentos comprados entram na cena: no chão (com as plantas, por profundidade), pendurados e voando
  const room = SCENES.roomMeta(S.place);
  const EQ = placeEquip(room, items, marks, hydro);
  const ground = (it) => it.y + it.h - 1 - (it.foot || 0);
  const all = items.concat(EQ.floor).map((it, k) => [it, k]).sort((a, b) => ground(a[0]) - ground(b[0]) || a[1] - b[1]).map((a) => a[0]);
  for (const f of EQ.back) f(lastTime);                 // parede e chão: duto, mangueira, termômetro
  if (sprites.vasos && sprites.estagios) SCENES.plants(g, S.place, all);
  for (const f of EQ.front) f(lastTime);                // animações por cima
  for (let k = drops.length - 1; k >= 0; k--) {            // gotinhas da rega
    const d = drops[k]; d.y += d.v; d.v += 0.05; d.life -= 1 / 40;
    if (d.life <= 0) { drops.splice(k, 1); continue; }
    g.globalAlpha = Math.min(1, d.life * 2); g.fillStyle = "#a6cbeb"; g.fillRect(Math.round(d.x), Math.round(d.y), 1, 2); g.globalAlpha = 1;
  }
  for (const m of marks) {                                  // brilho quando a planta muda de estágio
    const k = marks.indexOf(m), sp = lastTime - (stagePop[k] ?? -9);
    if (sp < 0.5) { g.fillStyle = "#fff0a6"; const r = Math.round(4 + sp * 14); for (const [dx, dy] of [[-r, 0], [r, 0], [0, -r], [-r * 0.7, -r * 0.7], [r * 0.7, -r * 0.7]]) g.fillRect(Math.round(m.x + dx), Math.round(m.top + 12 + dy), 1, 1); }
  }
  for (const m of marks) {
    if (!m.on && inTut()) continue;
    if (!m.on) { g.fillStyle = "#d95463"; g.font = "bold 9px monospace"; g.fillText("$", m.x - 3, m.top + 27); }
    else if (m.f > 0.92 && Math.floor(lastTime * 4) % 2 === 0) { g.fillStyle = "#fff0a6"; g.fillRect(m.x + 8, m.top, 1, 3); g.fillRect(m.x + 7, m.top + 1, 3, 1); }
    const [bx, by, bw] = m.bar;
    g.fillStyle = "#1a1420"; g.fillRect(bx, by, bw, m.pot ? 3 : 2);
    g.fillStyle = "#7cb342"; g.fillRect(bx + (m.pot ? 1 : 0), by + (m.pot ? 1 : 0), Math.round((bw - (m.pot ? 2 : 0)) * Math.min(1, m.f)), 1);
  }
  }
  SCENES.lighting(g, roomId);
  g.restore();
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i]; p.t += 1 / 60; p.y -= 0.45;
    g.globalAlpha = Math.max(0, 1 - p.t / 1.2);
    g.font = "bold 10px 'Silkscreen',monospace";
    g.fillStyle = "#1a1420"; g.fillText(p.s, p.x + 1, p.y + 1); g.fillStyle = p.c; g.fillText(p.s, p.x, p.y);
    g.globalAlpha = 1;
    if (p.t > 1.2) fx.splice(i, 1);
  }
  shake = Math.max(0, shake - 0.6);
}

let showAllSeeds = false, showAllEquip = false;
function estufa() {
  const cur = E.SEEDS[S.seed];
  // encomendas dos clientes (pagam 2-3x a venda comum)
  if (S.orders && S.orders.length) {
    h3("Encomendas");
    for (const o of S.orders) {
      const sd = E.SEEDS[o.seed];
      const d = row({
        emoji: o.emoji, title: `${o.who}`,
        desc: `Quer <b>${o.n} un de ${sd.name}</b> · <span class="gain">paga ${$$(o.pay)}</span> · +2 Respeito<br><span data-h></span> · expira em <span data-t></span>`,
        btn: "Entregar", btnCls: "dirty", enabled: () => S.stock[o.seed] >= o.n,
        onClick: () => { const ok = E.deliver(S, o.id); if (ok) deliveryTalk(o); return ok; },
      });
      bind(() => {
        d.querySelector("[data-t]").textContent = dur(Math.max(0, o.until - S.time));
        const have = S.stock[o.seed];
        d.querySelector("[data-h]").innerHTML = have >= o.n ? `<span class="good">você tem ${fmt(have)} ✓</span>` : `você tem ${fmt(have)} de ${o.n}`;
      });
    }
  }
  h3(`Sementes · plantando ${cur.name}`);
  // lucro por minuto de cada vaso: é o que diz se vale a pena plantar
  const k = E.townScale(S);
  const perMin = (sd) => (Math.max(1, Math.floor(sd.prod * E.prodMult(S))) * sd.sell * k - sd.price * k) / (sd.time / E.speed(S) / 60);
  const okSeeds = E.SEEDS.filter((sd, i) => E.seedOk(S, i));
  const best = okSeeds.reduce((a, b) => (perMin(b) > perMin(a) ? b : a), okSeeds[0]);
  const okIdx = E.SEEDS.map((sd, i) => i).filter((i) => E.seedOk(S, i));
  const keep = new Set([...okIdx.slice(-3), S.seed, best ? best.id : -1]);
  let hidden = 0;
  E.SEEDS.map((sd, i) => [sd, i]).reverse().forEach(([sd, i]) => {
    const lock = E.seedLocked(S, sd);
    if (!lock.length && !keep.has(i) && !showAllSeeds) { hidden++; return; }
    const profit = (Math.max(1, Math.floor(sd.prod * E.prodMult(S))) * sd.sell - sd.price) * k;
    if (lock.length && i > 0 && E.seedLocked(S, E.SEEDS[i - 1]).length) return; // mostra só a próxima trancada
    row({
      ico: seedIcon(i), title: sd.name, cls: (i === S.seed ? "sel" : "") + (lock.length ? " locked" : ""),
      desc: lock.length ? `<span class="req">Precisa: ${lock.join(", ")}</span>`
        : `Custa ${$$(sd.price * k)} · rende ${Math.max(1, Math.floor(sd.prod * E.prodMult(S)))} × ${$$(sd.sell * k)} a cada ${dur(sd.time / E.speed(S))}<br>` +
          `<span class="gain">+${$$(perMin(sd))}/min por vaso</span> <span class="gain2">(+${$$(profit)} por colheita)</span>${sd === best ? ' <span class="best">★ mais lucro</span>' : ""}`,
      btn: lock.length ? null : i === S.seed ? "Plantando" : "Plantar", enabled: () => i !== S.seed,
      onClick: () => E.chooseSeed(S, i),
    });
  });
  if (hidden || showAllSeeds) {
    const more = el(`<button class="buy" style="align-self:center;background:#403d54;color:#fffbef">${showAllSeeds ? "Mostrar só as melhores" : `Ver todas as sementes (+${hidden})`}</button>`);
    more.onclick = () => { showAllSeeds = !showAllSeeds; renderPanel(); };
    panel.appendChild(more);
  }
  h3("Esconderijo");
  const pl = E.PLACES[S.place];
  if (S.pots.length < E.maxPots(S)) row({
    ico: icon("vasos", 32, 0, 32, 24), title: "Mais um vaso", desc: `${S.pots.length} de ${pl.pots} vasos no ${pl.name}. Pago com grana suja.`,
    btn: $$(E.potCost(S)), btnCls: "dirty", enabled: () => S.dirty >= E.potCost(S), onClick: () => E.buyPot(S),
  });
  const np = E.PLACES[S.place + 1];

    ico: icon("vasos", 64, 0, 32, 24), title: np.name, desc: `Cabem ${np.pots} plantas.${np.tier > pl.tier ? " Visual novo!" : ""} ${E.placeNeedsClean(S) ? "Pago com grana limpa." : "É a sua casa: paga com qualquer grana."}<br><span class="req">Os equipamentos ficam para trás (menos os de compra única).</span>` +
      (E.placeWorkLeft(S) > 0 ? `<br><span class="req">🔒 Você acabou de chegar: quem se muda toda hora chama atenção. Fique mais ${Math.ceil(E.placeWorkLeft(S) / 60)} min no ${pl.name}.</span>` : ""),
    btn: $$(E.placeCost(S)), btnCls: E.placeNeedsClean(S) ? "clean" : "dirty",
    enabled: () => E.placeWorkLeft(S) === 0 && (E.placeNeedsClean(S) ? S.clean : S.clean + S.dirty) >= E.placeCost(S), onClick: () => E.buyPlace(S),
  });
  // fim do jogo: mudar de cidade (recomeça mais forte, sem fim)

      emoji: "🚚", title: `Mudar para ${E.townName(nt)}`,
      desc: `A polícia daqui já te conhece. Recomece do Armário numa cidade nova, levando atributos, Lenda e tudo o que aprendeu: <span class="gain">produção ×${Math.pow(1.25, nt).toFixed(2).replace(".", ",")} para sempre</span> e +${Math.max(1, E.legendFor(S.runEarned / E.townScale(S)))} Lenda. Lá tudo vale e custa 10× mais, as sementes pedem +6 de Botânica e a polícia é ${nt * 10}% mais esperta.` +
        (ok ? "" : `<br><span class="req">Libere a última semente (${E.SEEDS[E.SEEDS.length - 1].name}) para poder se mudar.</span>`),
      btn: "Mudar", btnCls: "clean", enabled: () => E.canMoveTown(S),
      onClick: () => { const g = E.moveTown(S); if (g) { toast(`Bem-vindo a ${E.townName(S.town)}!`); return true; } return false; },
    });
  }
  if (!S.ze) row({
    ico: icon("estagios", 64, 40, 32, 40), title: "Contratar o Zé", desc: `Vende sozinho no Discreto a cada ${E.R.zeEvery}s, até com o app fechado.`,
    btn: $$(E.R.zeCost), btnCls: "clean", enabled: () => S.clean >= E.R.zeCost, onClick: () => E.hireZe(S),
  });
}

        : closed ? `<span class="bad">fechada por ${dur(S.closed[f.id] - S.time)}</span>`
        : S.dirty > E.reserve(S) ? `<span class="good">lavando</span>` : `parada (só tem a reserva)`;
    });
  });

  // ---- lavagem na hora (com mercado)
  h3("Lavar na hora");
  E.LAUNDRY.forEach((m) => {
    const lock = S.attrs.lab < m.lab;
    const market = m.id === "crypto" || m.id === "nft";
    const d = row({
      emoji: { laranjas: "🍊", nft: "🖼️", crypto: "₿", consultoria: "📊" }[m.id], title: m.name, cls: lock ? "locked" : "",
      desc: lock ? `<span class="req">Precisa de Lábia ${m.lab}</span>` : market ? `<span data-sp></span><br><span data-fee></span> · ${m.time ? dur(m.time) : "na hora"} · +${m.para} Paranoia`
        : `Taxa ${pct(m.fee)} · ${m.time ? dur(m.time) : "na hora"} · +${m.para} Paranoia`,
    });
    if (market && !lock) {
      d.querySelector("[data-sp]").replaceWith(sparkline(m.id));
      const fe = d.querySelector("[data-fee]");
      bind(() => {
        const fee = E.marketFee(S, m.id), k = E.marketMult(m.id, S.time);
        fe.innerHTML = `Taxa <b>${pct(fee)}</b>${k < 0.8 ? ' <span class="good">boa hora!</span>' : k > 1.2 ? ' <span class="bad">cara</span>' : ""}`;
      });
    }
    if (!lock) {
      const chips = el(`<div class="chips"></div>`);
      [0.25, 0.5, 1].forEach((fr) => {
        const b = el(`<button class="buy clean">${fr === 1 ? "Tudo" : pct(fr)}</button>`);
        b.onclick = () => { if (E.launder(S, m.id, fr)) { renderPanel(); refresh(); } else toast("Agora não: Paranoia alta demais ou sem grana suja.", true); };
        bind(() => (b.disabled = S.dirty < 1));
        chips.appendChild(b);
      });
      d.lastElementChild.replaceWith(chips);
    }
  });
  if (S.laundry.length) {
    h3("Lavando agora");
    const c = el(`<div class="card"><p><b data-n></b> · <b data-v></b> limpos · tudo pronto em <span data-t></span></p><p style="font-size:12px" data-x></p><div class="prog"><i></i></div></div>`);
    bind(() => {
      if (!S.laundry.length) { c.querySelector("[data-n]").textContent = "Tudo lavado!"; c.querySelector("i").style.width = "100%"; return; }
      const total = S.laundry.reduce((a, l) => a + l.net, 0), last = Math.max(...S.laundry.map((l) => l.done));
      const next = Math.min(...S.laundry.map((l) => l.done)), first = S.laundry.reduce((a, l) => (l.done < a.done ? l : a));
      const m = E.LAUNDRY.find((x) => x.id === first.id);
      c.querySelector("[data-n]").textContent = S.laundry.length + (S.laundry.length > 1 ? " lavagens" : " lavagem");
      c.querySelector("[data-v]").textContent = $$(total);
      c.querySelector("[data-t]").textContent = dur(last - S.time);
      c.querySelector("[data-x]").textContent = `Próxima: ${$$(first.net)} em ${dur(next - S.time)}`;
      c.querySelector("i").style.width = pct(1 - (next - S.time) / Math.max(1, m.time));
    });
    panel.appendChild(c);
  }
}
