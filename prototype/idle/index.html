<title>Greenhood Idle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: app de uma tela no celular — HUD (grana, Paranoia, Estamina), cena da estufa (toque),
   barra de venda e cinco abas: Estufa, Lavagem, Loja, Cidade e Perfil. */
:root{
  --bg:#1a1420; --panel:#272436; --panel-2:#352450; --line:#403d54; --well:#1f1a2b;
  --fg:#ebe9e1; --muted:#9a9bad; --leaf:#7cb342; --leaf-2:#bcd95e;
  --dirty:#f0c94f; --clean:#48a38a; --heat:#d95463; --plum:#8160a8; --sta:#6590cc;
  --display:"Pixelify Sans","Trebuchet MS",system-ui,sans-serif;
  --num:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:15px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
.pad{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
header{background:var(--panel);padding-block:8px 8px;display:flex;flex-direction:column;gap:6px;border-bottom:2px solid var(--bg)}
.money{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.m small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.m b{font-family:var(--num);font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.m.dirty b{color:var(--dirty)} .m.clean b{color:var(--clean)}
.m.lvl{text-align:right} .m.lvl b{color:#c7a6ff}
.meter{display:grid;grid-template-columns:92px 1fr 44px;align-items:center;gap:8px;font-size:12px}
.meter span:first-child{text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.meter span:last-child{font-family:var(--num);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:12px;background:var(--bg);border:2px solid var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0%}
.para .bar{height:16px}
.para .bar i{background:linear-gradient(90deg,var(--clean),var(--dirty) 55%,var(--heat) 80%)}
.para .bar::after{content:"";position:absolute;top:0;bottom:0;left:60%;width:2px;background:#1a142088}
.para .bar::before{content:"";position:absolute;top:0;bottom:0;left:80%;width:2px;background:var(--heat);z-index:1}
.para span:first-child{color:#f2918a;font-weight:700}
.sta .bar i{background:var(--sta)}
.para .bar b{position:absolute;inset:0 auto 0 0;width:0;z-index:2;background:repeating-linear-gradient(135deg,#1a1420 0 3px,#6e2834 3px 6px);opacity:.85}
.status{font-size:12px;color:var(--muted);min-height:15px}
.status.warn{color:var(--dirty)} .status.danger{color:var(--heat);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
#scene{position:relative;touch-action:manipulation;cursor:pointer;background:#000;flex:0 0 auto}
canvas{display:block;width:100%;image-rendering:pixelated}
.tag{position:absolute;font-size:12px;background:#1a1420d9;padding:3px 8px;border:2px solid #1a1420;pointer-events:none}
#place{left:8px;top:8px} #busy{right:8px;top:8px;color:var(--leaf-2)}
#tip{position:absolute;left:8px;right:8px;top:36px;z-index:5;display:flex;gap:8px;align-items:flex-start;background:#fffbef;color:#1a1420;border:2px solid #1a1420;box-shadow:3px 3px 0 #1a1420;padding:8px 10px;font-size:13px;line-height:1.35;cursor:default;animation:pop .25s}
#tip[hidden]{display:none}
#tip .who{font-size:26px;line-height:1}
#tip b{color:#6e2834}
#tip .acts{display:flex;gap:6px;margin-top:6px}
#tip button{background:#1a1420;color:#fffbef;padding:3px 8px;font-size:12px}
#tip button.ghost{background:none;color:#1a1420;text-decoration:underline}
#tip:after{content:"";position:absolute;left:18px;bottom:-9px;border:8px solid transparent;border-top-color:#1a1420;border-bottom:0}
@keyframes pop{from{transform:scale(.9);opacity:0}}
#hint{left:50%;bottom:8px;transform:translateX(-50%);transition:opacity .4s;white-space:nowrap}
.sell{background:var(--panel);padding-block:8px;display:flex;flex-direction:column;gap:6px}
.stockline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.stockline b{color:var(--leaf-2);font-family:var(--num);font-size:13px}
.sbtns{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.sb.tired{opacity:.45}
.sb .stc{color:#a6cbeb}
.fx{display:inline-block;padding:0 4px;margin:2px 3px 0 0;font-size:11px;font-weight:bold;border:1px solid #1a1420}
.fx.g{background:#2c6a40;color:#bcd95e} .fx.r{background:#6e2834;color:#f2918a} .fx.n{background:#272436;color:#bfbfc8}
.t .flavor{color:#cfc6b8;font-style:italic}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--dirty);outline-offset:2px}
.sb{background:var(--panel-2);border:2px solid var(--bg);box-shadow:inset 0 -3px 0 #0006;padding:5px 1px 6px;display:flex;flex-direction:column;align-items:center;min-width:0;line-height:1.15}
.sb b{font-size:13px} .sb small{font-size:10px;color:var(--muted);white-space:nowrap}
.sb[data-l="2"] b{color:var(--dirty)} .sb[data-l="3"] b{color:#f2918a} .sb[data-l="4"] b{color:var(--heat)}
.sb:active{transform:translateY(2px);box-shadow:none}
.sb:disabled{opacity:.4}
.cd{height:4px;background:var(--bg)} .cd i{display:block;height:100%;background:var(--leaf);width:0%}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--bg);padding-top:4px}
nav button{padding:8px 0 7px;font-size:13px;color:var(--muted);background:var(--panel);border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--fg);border-top-color:var(--leaf);background:var(--line)}
main{flex:1;overflow-y:auto;background:var(--line);padding-block:8px 20px;display:flex;flex-direction:column;gap:6px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:8px 0 0;font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--bg);padding:6px 8px;min-width:0}
.row.sel{border-color:var(--leaf)} .row.locked{opacity:.65}
.ico{width:44px;height:44px;image-rendering:pixelated;background:#1a142088}
.emo{display:grid;place-items:center;font-size:24px}
.t{min-width:0} .t b{display:block;font-size:15px} .t small{display:block;font-size:12px;color:var(--muted);line-height:1.35}
.t .req{color:#f2918a} .t .ok{color:var(--leaf-2)}
.cashcard{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#1b4a55;border:2px solid var(--clean);padding:8px 12px;margin-bottom:6px}
.cashcard span{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8fd4a8}
.cashcard b{font-family:var(--num);font-size:22px;color:#8fd4a8}
.machine{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel);border:2px solid var(--line);padding:10px}
.machine .big{font-size:13px} .machine small{color:var(--muted)}
.machine button{font-size:15px;padding:14px 16px;background:#48a38a;color:#1a1420;font-weight:bold;border:2px solid #1a1420;box-shadow:0 3px 0 #1a1420;touch-action:manipulation}
.machine button:active{transform:translateY(2px);box-shadow:0 1px 0 #1a1420}
.machine .combo{font-family:var(--num);color:var(--dirty);font-size:16px}
.machine .got{color:#8fd4a8;font-family:var(--num);min-height:18px}
canvas.spark{display:inline-block;width:72px;height:18px;vertical-align:middle;image-rendering:pixelated;margin-right:4px}
.t .good{color:#7cdc5a;font-weight:bold} .t .bad{color:#f2918a;font-weight:bold}
.t .gain{color:#7cdc5a;font-weight:bold;font-family:var(--num);font-size:13px} .t .gain2{color:#7cb342}
.t .best{background:#7cdc5a;color:#1a1420;padding:0 4px;font-size:11px;font-weight:bold}
.lv{font-family:var(--num);font-size:11px;color:var(--dirty);margin-left:6px}
.buy{background:var(--leaf);color:#14292b;font-weight:700;padding:8px 8px;min-width:86px;border:2px solid #1a1420;box-shadow:inset 0 -3px 0 #0003;font-family:var(--num);font-size:12px;white-space:nowrap}
.buy.clean{background:var(--clean);color:#0d2026} .buy.dirty{background:var(--dirty);color:#2b1a10}
.buy:disabled{background:#403d54;color:var(--muted)}
.chips{display:flex;gap:4px} .chips .buy{min-width:0;padding:7px 8px}
.card{background:var(--panel);border:2px solid var(--bg);padding:12px;display:flex;flex-direction:column;gap:8px}
.card p{font-size:14px;line-height:1.45;color:#d6d4cc;margin:0}
.big{font-family:var(--num);font-size:20px;color:#c7a6ff}
.prog{height:8px;background:var(--bg);border:2px solid var(--line)} .prog i{display:block;height:100%;background:var(--clean);width:0%}
.attr{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.attr b{font-size:15px} .attr .v{font-family:var(--num);color:var(--dirty)} .attr small{grid-column:1/-1;color:var(--muted);font-size:12px}
.attr .prog{grid-column:1/-1}
.log{font-size:12px;color:var(--muted);line-height:1.5}
.log .batida,.log .flagrante{color:#f2918a} .log .attr{color:var(--leaf-2)} .log .lenda{color:#c7a6ff}
.danger{background:var(--plum);color:#fffbef;font-weight:700;padding:10px;border:2px solid #1a1420;font-size:15px}
.danger:disabled{background:#403d54;color:var(--muted)}
.modal{position:fixed;inset:0;background:#1a1420d0;display:grid;place-items:center;z-index:30;padding:16px}
.modal .card{max-width:360px;text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:25;background:#fffbef;color:#1a1420;border:3px solid #1a1420;padding:8px 12px;font-size:14px;max-width:92vw;box-shadow:0 4px 0 #0006;pointer-events:none}
.toast.bad{background:#f2918a}
#easy{right:8px;bottom:8px;color:#bcd95e;border-color:#4a8f40;pointer-events:none}
#master{left:8px;bottom:8px;color:#fff0a6;border-color:#d1952e;pointer-events:none}
.sheet{position:fixed;inset:0;background:#1a1420d0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--panel);border-top:3px solid var(--dirty);width:100%;max-width:520px;max-height:86%;overflow-y:auto;
  padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.sheet .top b{font-size:18px;color:var(--dirty)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid button{background:var(--panel-2);border:2px solid var(--bg);padding:8px 4px;font-size:13px;line-height:1.2;box-shadow:inset 0 -3px 0 #0006}
.grid button.on{background:var(--leaf);color:#14292b;font-weight:700}
.grid button.warn{background:#6e1b3d}
.grid button:active{transform:translateY(2px)}
@media (prefers-reduced-motion:reduce){.status.danger{animation:none}}
</style>

<div id="app">
  <header class="pad">
    <div class="money">
      <div class="m dirty"><small>Grana suja</small><b id="dirty">$0</b></div>
      <div class="m clean"><small>Grana limpa</small><b id="clean">$0</b></div>
      <div class="m lvl"><small>Nível</small><b id="lvl">1</b></div>
    </div>
    <div class="meter para"><span>👁 Paranoia</span><div class="bar"><i id="para"></i><b id="ficha" title="Ficha na polícia"></b></div><span id="paran">0%</span></div>
    <div class="meter sta"><span>⚡ Estamina</span><div class="bar"><i id="sta"></i></div><span id="stan">100</span></div>
    <div class="status" id="status"></div>
  </header>
  <div id="scene" role="button" aria-label="Tocar para fazer as plantas crescerem">
    <canvas id="cv" width="320" height="180"></canvas>
    <div class="tag" id="place">Armário Grow</div>
    <div class="tag" id="busy" hidden></div>
    <div class="tag" id="hint">toque para regar as plantas</div>
    <div class="tag" id="master" hidden>MASTER</div>
    <div class="tag" id="easy" hidden>MODO FÁCIL</div>
    <div id="tip" hidden role="status"><div class="who" aria-hidden="true">👵</div><div><div id="tiptext"></div><div class="acts"><button id="tipgo">Ver</button><button class="ghost" id="tipok">Entendi</button></div></div></div>
  </div>
  <div class="sell pad">
    <div class="stockline"><span>Estoque: <b id="units">0</b> un · vale <b id="value">$0</b></span><span id="cdtext"></span></div>
    <div class="sbtns" id="sbtns"></div>
    <div class="cd"><i id="cd"></i></div>
  </div>
  <nav class="pad" role="tablist">
    <button role="tab" data-tab="estufa" aria-selected="true">Estufa</button>
    <button role="tab" data-tab="lavagem" aria-selected="false">Lavagem</button>
    <button role="tab" data-tab="loja" aria-selected="false">Loja</button>
    <button role="tab" data-tab="cidade" aria-selected="false">Cidade</button>
    <button role="tab" data-tab="perfil" aria-selected="false">Perfil</button>
  </nav>
  <main class="pad" id="panel"></main>
</div>

<script>
// Economia do Greenhood Idle — o GDD inteiro adaptado para jogo idle.
// Funções puras sobre um objeto de estado: roda igual no navegador e no Node (simulação).
(function (root) {
  "use strict";

  // ---------------------------------------------------------------- catálogos
  // Sementes (números do GDD): preço (grana suja, pago a cada plantio), venda por unidade,
  // unidades por colheita, Botânica mínima, equipamentos exigidos e tempo de crescimento (s).
  const SEEDS = [
    ["Alface Mística", 5, 8, 3, 0, [], 30],
    ["Hortelã Selvagem", 10, 15, 3, 0, [], 35],
    ["Manjericão do Olimpo", 20, 30, 4, 1, [], 45],
    ["Tomate Atômico", 50, 80, 4, 2, ["regador"], 55],
    ["Pimenta do Capeta", 120, 200, 3, 3, ["regador", "termometro"], 60],
    ["Cogumelo Saltitante", 300, 500, 5, 4, ["termometro", "ventilador"], 75],
    ["Lavanda Hipnótica", 800, 1200, 4, 5, ["fertilizante", "ventilador"], 90],
    ["Cacto Cabeludo", 2000, 3500, 2, 6, ["ph", "termometro"], 100],
    ["Lótus Azul", 5000, 8000, 3, 7, ["lampada", "ph", "fertilizante"], 120],
    ["Cipó Enrolado", 12000, 25000, 2, 8, ["estufa", "ph", "fertilizante"], 150],
    ["Orquídea Fantasma", 30000, 60000, 2, 10, ["lampada", "estufa", "filtro"], 180],
    ["Trufa Negra", 80000, 150000, 2, 12, ["led", "filtro", "ph"], 210],
    ["Mandrágora", 200000, 450000, 1, 14, ["led", "hidro", "filtro"], 240],
    ["Bonsai Milenar", 500000, 1.2e6, 1, 16, ["hidro", "co2", "led"], 300],
    ["Rafflesia Gigante", 1.5e6, 4e6, 1, 18, ["co2", "osmose", "led", "filtro"], 360],
    ["Aurora Boreal", 5e6, 1.5e7, 1, 20, ["ia", "co2", "osmose", "led"], 420],
    ["Fruto do Éden", 2e7, 6.5e7, 1, 25, ["ia", "bunker", "lab"], 600],
    ["Broto de Yggdrasil", 1e8, 3.5e8, 1, 30, ["lab", "bunker", "ia", "osmose"], 900],
  ].map(([name, price, sell, prod, bot, req, time], id) => ({ id, name, price, sell, prod, bot, req, time, frame: id }));

  // Equipamentos (GDD): preço em grana limpa e bônus de produção. Cada um tem níveis
  // (o 1º libera sementes; os seguintes repetem o bônus) e um efeito extra.
  // Regras de instalação. max: níveis (5, ou 1 = compra única). keep: vai com você ao se mudar
  // (os outros ficam para trás e são comprados de novo no lugar novo). place: lugar mínimo onde cabe.
  const EQUIP_RULES = {
    regador: { max: 5, place: 0 }, tesoura: { max: 5, place: 1 }, ventilador: { max: 5, place: 1 },
    termometro: { max: 5, place: 1 }, fertilizante: { max: 5, place: 1 }, lampada: { max: 5, place: 1 },
    ph: { max: 5, place: 1 }, estufa: { max: 5, place: 2 }, drone: { max: 1, keep: true, place: 3 },
    filtro: { max: 5, place: 3 }, led: { max: 5, place: 3 }, hidro: { max: 1, keep: true, place: 6 },
    co2: { max: 5, place: 6 }, cameras: { max: 5, place: 4 }, osmose: { max: 5, place: 7 },
    ia: { max: 1, keep: true, place: 7 }, bunker: { max: 1, keep: true, place: 12, only: true },
    lab: { max: 1, keep: true, place: 12, only: true },
  };
  const EQUIP = [
    ["regador", "Regador de garrafa PET", 100, 0.02, { speed: 0.05 }, "Cresce 5% mais rápido"],
    ["tesoura", "Tesoura enferrujada", 150, 0.02, { tap: 0.5 }, "Toque 50% mais forte"],
    ["ventilador", "Ventilador torto", 300, 0.03, {}, ""],
    ["termometro", "Termômetro na tábua", 500, 0.03, {}, ""],
    ["fertilizante", "Adubo \"El Secreto\"", 1000, 0.04, {}, ""],
    ["lampada", "Lâmpada com alumínio", 2500, 0.05, { speed: 0.1 }, "Cresce 10% mais rápido"],
    ["ph", "Medidor de pH", 5000, 0.04, {}, ""],
    ["estufa", "Mini estufa", 12000, 0.05, { speed: 0.1 }, "Cresce 10% mais rápido"],
    ["drone", "Drone de vigilância", 25000, 0.02, { calm: 0.1 }, "Vendas geram 10% menos Paranoia"],
    ["filtro", "Filtro de carbono", 50000, 0.06, { calm: 0.1 }, "Vendas geram 10% menos Paranoia"],
    ["led", "Painel LED", 120000, 0.08, { speed: 0.15 }, "Cresce 15% mais rápido"],
    ["hidro", "Sistema hidropônico", 300000, 0.1, { speed: 0.15 }, "Cresce 15% mais rápido"],
    ["co2", "Gerador de CO2", 800000, 0.09, { speed: 0.15 }, "Cresce 15% mais rápido"],
    ["cameras", "Câmeras 4K", 1.5e6, 0.03, { guard: 0.1 }, "Rondas têm 10% menos chance de te achar"],
    ["osmose", "Osmose reversa", 4e6, 0.08, {}, ""],
    ["ia", "Controlador IA", 1e7, 0.15, { tap: 1 }, "Toque 100% mais forte"],
    ["bunker", "Kit bunker", 3.5e7, 0.12, { guard: 0.25 }, "Rondas têm 25% menos chance de te achar"],
    ["lab", "Lab. de genética", 1.5e8, 0.2, { speed: 0.25 }, "Cresce 25% mais rápido"],
  ].map(([id, name, price, prod, fx, fxText], i) => ({ id, name, price, prod, fx, fxText, frame: i, ...EQUIP_RULES[id] }));
  const EQUIP_LEVEL_MULT = 3; // cada nível extra custa 3x o anterior (nível 5 = 81x o preço inicial)

  // Imóveis (GDD), em grana limpa. tier = visual (0 gambiarra, 1 profissional, 2 high-tech).
  const PLACES = [
    ["Armário Grow", 0, 1, 0],
    ["Quartinho dos fundos", 100, 3, 0],
    ["Garagem do Vizinho", 1500, 4, 0],
    ["Porão Abandonado", 4000, 5, 0],
    ["Sobrado na Favela", 10000, 6, 0],
    ["Terreno Abandonado", 25000, 8, 1],
    ["Container Marítimo", 75000, 10, 1],
    ["Galpão Industrial", 200000, 12, 1],
    ["Sítio na Serra", 500000, 14, 1],
    ["Fazenda Paraíso Verde", 1.5e6, 18, 1],
    ["Mina de Ouro Desativada", 5e6, 24, 2],
    ["Praia Particular", 2e7, 30, 2],
    ["Bunker Desativado", 8e7, 40, 2],
  ].map(([name, cost, pots, tier], id) => ({ id, name, cost, pots, tier }));

  // Venda (GDD): quantidade máxima, Paranoia, chance de flagrante e bônus de preço.
  // Venda: fatia do estoque que sai (pct), Paranoia, chance de flagrante e bônus de preço.
  // Quanto maior a fatia, maior o risco; o All-in vende tudo com o maior risco.
  const SALES = [
    // sta: Estamina gasta pela venda (proporcional ao tamanho; o Zé não gasta a sua)
    { name: "Discreto", pct: 0.05, para: 5, risk: 0, bonus: 0, sta: 1 },
    { name: "Normal", pct: 0.15, para: 15, risk: 0.03, bonus: 0.1, sta: 3 },
    { name: "Ousado", pct: 0.35, para: 25, risk: 0.08, bonus: 0.25, sta: 6 },
    { name: "Agressivo", pct: 0.7, para: 40, risk: 0.15, bonus: 0.5, sta: 10 },
    { name: "All-in", pct: 1, para: 60, risk: 0.3, bonus: 1, sta: 16 },
  ];

  // Lavagem (GDD): taxa, tempo (s), Paranoia e Lábia mínima.
  const LAUNDRY = [
    { id: "laranjas", name: "Laranjas", fee: 0.2, time: 600, para: 2, lab: 0 },
    { id: "nft", name: "NFTs falsos", fee: 0.35, time: 0, para: 15, lab: 0 },
    { id: "crypto", name: "Mixer de crypto", fee: 0.25, time: 180, para: 8, lab: 5 },
    { id: "consultoria", name: "Consultoria fantasma", fee: 0.15, time: 300, para: 5, lab: 10 },
  ];

  // Cidade (GDD): custo em grana limpa, Estamina gasta, duração (s) e efeitos.
  const CITY = [
    { id: "cafe", name: "Café", cost: 5, sta: 0, time: 60, fx: { sta: 30, para: 15 } },
    { id: "energetico", name: "Energético", cost: 15, sta: 0, time: 120, fx: { sta: 50, para: 30 } },
    { id: "bar", name: "Bar do Zé", cost: 8, sta: 0, time: 180, fx: { sta: 20, para: 5, lab: 1 } },
    { id: "biblioteca", name: "Biblioteca", cost: 3, sta: 10, time: 300, fx: { bot: 1 } },
    { id: "academia", name: "Academia", cost: 12, sta: 20, time: 600, fx: { seg: 1, resp: 1 } },
    { id: "beco", name: "Beco Escuro", cost: 20, sta: 15, time: 600, fx: { fur: 2, para: 20 } },
    { id: "praca", name: "Praça do Papo", cost: 6, sta: 10, time: 300, fx: { lab: 2, resp: 1 } },
    { id: "spa", name: "Spa", cost: 100, sta: 0, time: 900, fx: { para: -50 } },
    { id: "fliperama", name: "Fliperama", cost: 10, sta: 0, time: 300, fx: { para: -20, sta: 5 } },
  ];

  // Fachadas: negócios que lavam sozinhos (até com o app fechado). cap = $/min no nível 1.
  // Cada nível: custa 2,5x e lava 1,7x mais. Nunca mexem na reserva para replantar.
  const FRONTS = [
    { id: "lavajato", name: "Lava-jato do Primo", emoji: "🚗", cost: 300, cap: 30, fee: 0.15 },
    { id: "pastel", name: "Pastelaria da Esquina", emoji: "🥟", cost: 3000, cap: 250, fee: 0.14 },
    { id: "barbearia", name: "Barbearia Navalha", emoji: "💈", cost: 25000, cap: 2000, fee: 0.13 },
    { id: "igreja", name: "Igreja da Prosperidade", emoji: "⛪", cost: 200000, cap: 16000, fee: 0.12 },
    { id: "cambio", name: "Casa de Câmbio", emoji: "💱", cost: 2e6, cap: 150000, fee: 0.12 },
    { id: "galeria", name: "Galeria de Arte", emoji: "🖼️", cost: 2e7, cap: 1.4e6, fee: 0.11 },
    { id: "futebol", name: "Time de Futebol", emoji: "⚽", cost: 3e8, cap: 2e7, fee: 0.1 },
  ];
  const FRONT_MAX = 10;

  // Visita surpresa da Vó: pequena chance para todo mundo. Ela descobre tudo e você escolhe uma
  // de duas explicações (sorteadas destas 10): 5 levam à cadeia, 4 passam, 1 deixa a Paranoia lá em cima.
  const SURPRISE = [
    { say: "É tempero pra sua sopa, vó!", res: "Ela prova uma folha, passa mal e chama a ambulância. A polícia veio junto.", kind: "bust" },
    { say: "É um trabalho da escola sobre fotossíntese.", res: "Ela liga na escola para elogiar você. A diretora chama a polícia.", kind: "bust" },
    { say: "São plantas de um amigo, tô só cuidando.", res: "\"Então liga pra ele agora.\" Você liga pro Zé, que atende: \"E aí, chefe, chegou a carga?\"", kind: "bust" },
    { say: "Tô empreendendo, vó! É um negócio.", res: "Ela fica orgulhosa e conta para a vizinha, que é casada com o delegado.", kind: "bust" },
    { say: "Isso? Nunca vi na vida.", res: "Ela não acredita e chama seu tio, que é policial.", kind: "bust" },
    { say: "É chá pra sua artrite, vó.", res: "Ela se emociona, leva um pouquinho e jura segredo.", kind: "safe" },
    { say: "São mudas pra horta da igreja.", res: "Ela te dá a bênção e um pedaço de bolo. +30⚡", kind: "safe", sta: 30 },
    { say: "Tô estudando pra ser botânico.", res: "Ela te dá um livro velho de plantas. Você aprende umas coisas.", kind: "safe", bot: true },
    { say: "É surpresa pro seu aniversário!", res: "Ela chora, te abraça e promete não contar pra ninguém.", kind: "safe" },
    { say: "Senta aí, vó, vou te contar a verdade...", res: "Ela desmaia, acorda e passa a semana te ligando de hora em hora. A Paranoia foi lá em cima.", kind: "para" },
  ];

  const ATTRS = { bot: "Botânica", lab: "Lábia", fur: "Furtividade", seg: "Segurança" };

  // ---------------------------------------------------------------- regras
  const R = {
    tapSeconds: 0.35, // cada toque adianta 0,35 s de crescimento em todos os vasos
    paraDecay: 1 / 8, // Paranoia cai 1 a cada 8 s
    fichaStep: 10, fichaMax: 50, // cada batida sobe a ficha na polícia (piso da Paranoia)
    fichaLenda: 5, // a cada 5 de Lenda ganhos depois da batida, a ficha baixa 5
    loanPara: 3 / 60, // dívida com o agiota: +3 por minuto
    staRegen: 1 / 20, // Estamina: +1 a cada 20 s
    raidEvery: 300, raidAt: 80, raidChance: 0.5,
    zeCost: 300, zeEvery: 20, zeMaxPara: 60,
    frontPara: 0.4 / 60, // cada fachada lavando: +0,4 de Paranoia por minuto
    surpriseEvery: 900, surpriseChance: 0.06, // a cada 15 min, 6% de chance (com o jogo aberto)
    fiscalEvery: 420, fiscalChance: 0.35, fiscalClose: 900, // fiscal da Receita: a cada 7 min, 35%; fechar = 15 min
    billSta: 1, billPara: 0.15, // maquininha: por toque
    avoEvery: 180,
    loan: 500, loanBack: 750,
    offlineCap: 8 * 3600,
    legendBonus: 0.1,
  };

  // ---------------------------------------------------------------- estado
  function newState(seed = 12345) {
    return {
      v: 2,
      dirty: 20, clean: 0, para: 0, sta: 100, resp: 0,
      attrs: { bot: 1, lab: 1, fur: 1, seg: 1 },
      xp: { bot: 0, lab: 0, fur: 0, seg: 0 },
      place: 0,
      ficha: 0, fichaLenda: 0, // ficha na polícia: piso da Paranoia
      pots: [{ g: 0, s: 0, on: true }],
      seed: 0, // semente escolhida para replantar
      stock: Array(SEEDS.length).fill(0),
      equip: {},
      laundry: [], // { amount, done(t), fee }
      fronts: {}, // id -> nível
      closed: {}, // id -> até quando a fachada fica fechada
      fiscal: null, fiscalT: 0, // fiscal da Receita esperando resposta
      surprise: null, surpT: 0, // visita surpresa da Vó esperando sua explicação
      city: null, // { id, end }
      ze: false, zeT: 0,
      avoT: 0, debt: 0,
      saleCd: 0,
      raidT: 0,
      legend: 0, runEarned: 0, timesArrested: 0, busts: 0,
      time: 0, rng: seed,
      log: [],
    };
  }

  function rand(s) {
    let x = s.rng | 0;
    x ^= x << 13; x ^= x >>> 17; x ^= x << 5;
    s.rng = x;
    return ((x >>> 0) % 1000000) / 1000000;
  }
  function note(s, kind, text) {
    s.log.push({ t: s.time, kind, text });
    if (s.log.length > 50) s.log.shift();
  }

  // ---------------------------------------------------------------- derivados
  const lvl = (s, id) => s.equip[id] || 0;
  const fxSum = (s, key) => EQUIP.reduce((a, e) => a + (e.fx[key] || 0) * lvl(s, e.id), 0);
  const level = (s) => Math.max(1, Math.floor(Math.sqrt(s.resp / 5)));
  const legendMult = (s) => 1 + R.legendBonus * s.legend;
  // produção: soma dos bônus dos equipamentos + Botânica × 2% (GDD)
  const prodMult = (s) => 1 + EQUIP.reduce((a, e) => a + e.prod * lvl(s, e.id), 0) + s.attrs.bot * 0.02;
  // crescimento: tempo = base / (1 + Botânica × 5%) (GDD), mais equipamentos de velocidade
  // Modo fácil (para testar com amigos): cresce 3x mais rápido, vende 2x mais caro, tudo custa 30%,
  // atributos sobem 3x mais rápido, Paranoia cai 2x mais rápido e a espera entre vendas cai pela metade.
  const EASY = { speed: 3, price: 2, cost: 0.3, xp: 3, decay: 2, cd: 0.5 };
  const ez = (s, k) => (s.easy ? EASY[k] : 1);
  const speed = (s) => (1 + s.attrs.bot * 0.05) * (1 + fxSum(s, "speed")) * ez(s, "speed");
  const tapPower = (s) => R.tapSeconds * speed(s) * (1 + fxSum(s, "tap"));
  const priceMult = (s, lvlIdx) => (1 + s.attrs.lab * 0.02) * (1 + SALES[lvlIdx].bonus) * legendMult(s) * (1 + (level(s) - 1) * 0.01) * ez(s, "price");
  const riskOf = (s, lvlIdx) => Math.max(0, SALES[lvlIdx].risk - s.attrs.fur * 0.004);
  const paraOf = (s, lvlIdx) => SALES[lvlIdx].para * Math.max(0.2, 1 - fxSum(s, "calm") - s.attrs.fur * 0.01);
  const saleSta = (s, lvlIdx) => staCost(s, SALES[lvlIdx].sta);
  const staCost = (s, base) => (s.para >= 60 ? base * 2 : base);
  const maxPots = (s) => PLACES[s.place].pots;
  const potCost = (s) => Math.round(20 * Math.pow(2.6, s.pots.length - 1) * ez(s, "cost")); // grana suja
  const equipCost = (s, e) => Math.round(e.price * Math.pow(EQUIP_LEVEL_MULT, lvl(s, e.id)) * ez(s, "cost"));
  const placeCost = (s, i = s.place + 1) => (PLACES[i] ? Math.round(PLACES[i].cost * ez(s, "cost")) : Infinity);
  const saleCooldown = (s) => Math.max(3, 20 - 17 * (topStockSeed(s) / (SEEDS.length - 1))) * Math.max(0.4, 1 - s.attrs.lab * 0.01) * ez(s, "cd");
  const stockUnits = (s) => s.stock.reduce((a, b) => a + b, 0);
  const stockValue = (s) => s.stock.reduce((a, n, i) => a + n * SEEDS[i].sell, 0);
  function topStockSeed(s) {
    for (let i = SEEDS.length - 1; i >= 0; i--) if (s.stock[i] > 0) return i;
    return 0;
  }

  function seedLocked(s, seed) {
    const why = [];
    if (s.attrs.bot < seed.bot) why.push(`Botânica ${seed.bot}`);
    for (const r of seed.req) if (!lvl(s, r)) why.push(EQUIP.find((e) => e.id === r).name);
    return why;
  }
  const seedOk = (s, i) => seedLocked(s, SEEDS[i]).length === 0;

  // Renda estimada (grana suja/s) se tudo for vendido no Discreto.
  function incomePerSec(s) {
    let total = 0;
    for (const p of s.pots) {
      const seed = SEEDS[p.s];
      const per = (seed.prod * prodMult(s) * seed.sell * priceMult(s, 0) - seed.price) / (seed.time / speed(s));
      total += Math.max(0, per);
    }
    return total;
  }

  // ---------------------------------------------------------------- plantio
  function plant(s, pot) {
    const seed = SEEDS[pot.s];
    if (s.dirty < seed.price || !seedOk(s, pot.s)) { pot.on = false; return false; }
    s.dirty -= seed.price;
    pot.on = true;
    pot.g = 0;
    return true;
  }

  function harvest(s, pot) {
    const seed = SEEDS[pot.s];
    const units = Math.max(1, Math.floor(seed.prod * prodMult(s)));
    s.stock[pot.s] += units;
    s.resp += 1;
    gainXp(s, "bot", 1);
    pot.s = s.seed; // replanta com a semente escolhida
    return units;
  }

  function growAll(s, seconds) {
    let n = 0;
    for (const p of s.pots) {
      if (!p.on && !plant(s, p)) continue;
      p.g += seconds;
      const t = SEEDS[p.s].time;
      while (p.g >= t) {
        const carry = p.g - t;
        n += harvest(s, p) ? 1 : 0;
        if (!plant(s, p)) { p.g = 0; break; }
        p.g = Math.min(carry, SEEDS[p.s].time * 0.99);
      }
    }
    return n;
  }

  // ---------------------------------------------------------------- atributos
  const XP_NEED = {
    bot: (l) => 20 * Math.pow(l, 1.8),
    lab: (l) => 40 * Math.pow(l, 1.8),
    fur: (l) => 6 * Math.pow(l, 1.8),
    seg: (l) => 10 * Math.pow(l, 1.8),
  };
  function gainXp(s, k, amt) {
    s.xp[k] += amt * ez(s, "xp");
    while (s.xp[k] >= XP_NEED[k](s.attrs[k])) {
      s.xp[k] -= XP_NEED[k](s.attrs[k]);
      s.attrs[k]++;
      note(s, "attr", `+1 ${ATTRS[k]} (agora ${s.attrs[k]})`);
    }
  }

  // ---------------------------------------------------------------- ações
  function tap(s) {
    return growAll(s, tapPower(s));
  }

  // Ações (fora a venda) que levariam a Paranoia a 100% são bloqueadas: só a venda é aposta.
  const safe = (s, add) => s.para + add < 100;

  function sell(s, lvlIdx, auto = false) {
    if (s.saleCd > 0 || stockUnits(s) <= 0) return null;
    const L = SALES[lvlIdx];
    if (!auto) {
      const sc = staCost(s, L.sta);
      if (s.sta < sc) return null;
      s.sta -= sc;
    }
    // vende a fatia do estoque (no mínimo 1 unidade), começando pelas plantas mais valiosas
    let left = Math.max(1, Math.ceil(stockUnits(s) * L.pct)), units = 0, value = 0;
    for (let i = SEEDS.length - 1; i >= 0 && left > 0; i--) {
      const q = Math.min(left, s.stock[i]);
      if (q <= 0) continue;
      s.stock[i] -= q; left -= q; units += q; value += q * SEEDS[i].sell;
    }
    s.saleCd = saleCooldown(s);
    if (!(s.cheat && s.cheat.noPolice) && rand(s) < riskOf(s, lvlIdx)) {
      // flagrante: perde a mercadoria, multa na grana suja, +Paranoia
      const fine = s.dirty * Math.max(0.05, 0.25 - s.attrs.seg * 0.01);
      s.dirty -= fine;
      s.sta = Math.max(0, s.sta - 20);
      s.resp = Math.max(0, s.resp - 5);
      s.para += 15;
      s.timesArrested++;
      note(s, "flagrante", `Flagrante! Perdeu ${units} unidades e $${Math.round(fine)} de multa.`);
      checkBust(s);
      return { units, money: 0, caught: true };
    }
    const money = Math.floor(value * priceMult(s, lvlIdx));
    s.dirty += money;
    s.runEarned += money;
    s.para += paraOf(s, lvlIdx);
    s.resp += Math.ceil(units / 3);
    gainXp(s, "lab", Math.sqrt(units) * (lvlIdx + 1));   // raiz: vender muito não dispara a Lábia
    if (lvlIdx >= 1) gainXp(s, "fur", lvlIdx);
    checkBust(s);
    return { units, money, caught: false };
  }

  // Mercado: a taxa do crypto e dos NFTs sobe e desce (ciclos de ~10 min e ~3 min).
  function marketMult(id, t) {
    const ph = id === "nft" ? 2.1 : 0;
    const m = 1 + 0.55 * Math.sin((2 * Math.PI * t) / 600 + ph) + 0.2 * Math.sin((2 * Math.PI * t) / 170 + ph * 1.7);
    return Math.max(0.3, Math.min(1.8, m));
  }
  const marketFee = (s, id, t = s.time) => {
    const m = LAUNDRY.find((x) => x.id === id);
    return id === "crypto" || id === "nft" ? Math.min(0.9, m.fee * marketMult(id, t)) : m.fee;
  };
  // reserva para replantar: fachadas e maquininha não encostam nela
  const reserve = (s) => Math.max(30, SEEDS[s.seed].price * s.pots.length * 3);
  const frontLvl = (s, id) => (s.fronts && s.fronts[id]) || 0;
  const frontCost = (s, f) => Math.round(f.cost * Math.pow(2.5, frontLvl(s, f.id)) * ez(s, "cost"));
  const frontCap = (f, l) => (l ? f.cap * Math.pow(1.7, l - 1) : 0); // $/min
  function buyFront(s, id) {
    const f = FRONTS.find((x) => x.id === id);
    if (frontLvl(s, id) >= FRONT_MAX) return false;
    const c = frontCost(s, f);
    if (s.clean < c) return false;
    s.clean -= c;
    s.fronts[id] = frontLvl(s, id) + 1;
    return true;
  }
  const frontOpen = (s, id) => !(s.closed && s.closed[id] > s.time) && !(s.fiscal && s.fiscal.id === id);
  function runFronts(s, dt) {
    let avail = Math.max(0, s.dirty - reserve(s)), active = 0;
    for (const f of FRONTS) {
      const l = frontLvl(s, f.id);
      if (!l || !frontOpen(s, f.id) || avail <= 0) continue;
      const amt = Math.min(avail, (frontCap(f, l) / 60) * dt);
      avail -= amt; s.dirty -= amt;
      s.clean += amt * (1 - f.fee);
      active++;
    }
    if (active) s.para += active * R.frontPara * dt;
    return active;
  }
  // Fiscal da Receita: aparece numa fachada que está lavando
  function fiscalCheck(s, dt) {
    if (s.fiscal) {
      if (s.time - s.fiscal.at > 120) fiscalClose(s, true); // ninguém respondeu: fecha sozinha
      return;
    }
    s.fiscalT += dt;
    if (s.fiscalT < R.fiscalEvery) return;
    s.fiscalT = 0;
    const open = FRONTS.filter((f) => frontLvl(s, f.id) && frontOpen(s, f.id));
    if (!open.length || s.dirty <= reserve(s) || rand(s) > R.fiscalChance) return;
    const f = open[open.length - 1]; // a maior chama mais atenção
    const bribe = Math.round(frontCap(f, frontLvl(s, f.id)) * 8 * Math.max(0.5, 1 - s.attrs.lab * 0.01));
    s.fiscal = { id: f.id, at: s.time, bribe };
    note(s, "fiscal", `Fiscal da Receita na ${f.name}!`);
  }
  function fiscalBribe(s) {
    if (!s.fiscal || s.clean < s.fiscal.bribe) return false;
    s.clean -= s.fiscal.bribe;
    note(s, "city", "O fiscal pegou o envelope e foi embora.");
    s.fiscal = null;
    return true;
  }
  function fiscalClose(s, auto) {
    if (!s.fiscal) return false;
    s.closed[s.fiscal.id] = s.time + R.fiscalClose;
    note(s, "city", auto ? "Ninguém atendeu o fiscal: a fachada ficou fechada por 15 min." : "Você fechou a fachada por 15 min até a poeira baixar.");
    s.fiscal = null;
    return true;
  }
  function fiscalRisk(s) {
    if (!s.fiscal) return null;
    s.fiscal = null;
    if (rand(s) < 0.5 + s.attrs.lab * 0.005) { note(s, "city", "Você enrolou o fiscal. Passou!"); return true; }
    const fine = Math.round(s.clean * 0.3);
    s.clean -= fine;
    s.para += 20;
    note(s, "flagrante", `O fiscal não engoliu: multa de $${fine} e +20 Paranoia.`);
    checkBust(s);
    return false;
  }
  // Maquininha de contar notas: lava sem taxa, mas cansa. Combo de 1 a 50 (cada toque rápido soma +1).
  const BILL_MAX = 50;
  const billValue = (s) => Math.max(10, incomePerSec(s) * 1.5);
  function countBills(s, combo) {
    const cost = staCost(s, R.billSta);
    if (s.sta < cost) return 0;
    const amt = Math.min(Math.max(0, s.dirty - reserve(s)), billValue(s) * Math.max(1, Math.min(BILL_MAX, combo)));
    if (amt < 1) return 0;
    if (!safe(s, R.billPara)) return 0;
    s.sta -= cost;
    s.dirty -= amt; s.clean += amt;
    s.para += R.billPara;
    return amt;
  }

  function launder(s, methodId, fraction) {
    const m = LAUNDRY.find((x) => x.id === methodId);
    if (s.attrs.lab < m.lab) return false;
    const amount = Math.floor(s.dirty * fraction);
    if (amount < 1) return false;
    s.dirty -= amount;
    if (!safe(s, m.para)) return false;
    const net = Math.floor(amount * (1 - marketFee(s, methodId)));
    s.para += m.para;
    if (m.time === 0) s.clean += net;
    else s.laundry.push({ id: m.id, net, done: s.time + m.time });
    checkBust(s);
    return true;
  }

  // por que não dá para comprar agora ("" = pode)
  function equipBlock(s, e) {
    if (lvl(s, e.id) >= e.max) return e.max === 1 ? "Já instalado" : "Nível máximo";
    if (s.place < e.place) return e.only ? `Só no ${PLACES[e.place].name}` : `Não cabe no ${PLACES[s.place].name} · precisa de ${PLACES[e.place].name}`;
    return "";
  }
  function bestSeed(s) { for (let i = SEEDS.length - 1; i >= 0; i--) if (seedOk(s, i)) return i; return 0; }
  function buyEquip(s, id) {
    const e = EQUIP.find((x) => x.id === id);
    if (equipBlock(s, e)) return false;
    const c = equipCost(s, e);
    if (s.clean < c) return false;
    s.clean -= c;
    s.equip[id] = lvl(s, id) + 1;
    return true;
  }
  function buyPlace(s) {
    const next = PLACES[s.place + 1];
    const pc = placeCost(s);
    if (!next || s.clean < pc) return false;
    s.clean -= pc;
    s.place++;
    // os equipamentos do lugar antigo ficam para trás; só os de compra única vêm junto
    for (const e of EQUIP) if (!e.keep) delete s.equip[e.id];
    if (!seedOk(s, s.seed)) s.seed = bestSeed(s);
    return true;
  }
  function buyPot(s) {
    if (s.pots.length >= maxPots(s)) return false;
    const c = potCost(s);
    if (s.dirty < c) return false;
    s.dirty -= c;
    s.pots.push({ g: 0, s: s.seed, on: false });
    return true;
  }
  function chooseSeed(s, i) {
    if (!seedOk(s, i)) return false;
    s.seed = i;
    // vasos vazios ou parados trocam já; os que estão crescendo trocam na próxima colheita
    for (const p of s.pots) if (!p.on || p.g === 0) { p.s = i; p.on = false; }
    return true;
  }
  function hireZe(s) {
    if (s.ze || s.clean < R.zeCost) return false;
    s.clean -= R.zeCost;
    s.ze = true;
    return true;
  }
  function startCity(s, id) {
    const a = CITY.find((x) => x.id === id);
    if (s.city) return false;
    const cost = staCost(s, a.sta);
    if (s.clean < a.cost || s.sta < cost) return false;
    if (a.fx.para > 0 && !safe(s, a.fx.para)) return false;
    s.clean -= a.cost;
    s.sta -= cost;
    s.city = { id, end: s.time + a.time };
    return true;
  }
  function finishCity(s) {
    const a = CITY.find((x) => x.id === s.city.id);
    const fx = a.fx;

// ---------------------------------------------------------------- formatação
function fmt(n) {
  if (!isFinite(n)) return "∞";
  const neg = n < 0; n = Math.abs(n);
  let out;
  if (n < 1000) out = Math.floor(n).toString();
  else {
    const u = ["mil", "mi", "bi", "tri", "qua", "qui", "sex", "sep"];
    let i = -1;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    out = (n < 10 ? n.toFixed(2) : n < 100 ? n.toFixed(1) : n.toFixed(0)).replace(".", ",") + " " + u[i];
  }
  return (neg ? "-" : "") + out;
}
const $$ = (n) => "$" + fmt(n);
const pct = (x) => Math.round(x * 100) + "%";
function dur(t) {
  t = Math.max(0, Math.ceil(t));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return h ? `${h}h${String(m).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`;
}

// ---------------------------------------------------------------- estado
let S;
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      S = Object.assign(E.newState(), d.s);
      S.place = Math.min(S.place, E.PLACES.length - 1); // saves antigos podiam estar na Estação Espacial
      const away = (Date.now() - d.at) / 1000;
      if (away > 30) {
        const r = E.offline(S, away);
        const parts = [];
        if (r.units > 0) parts.push(`colheu <b>${fmt(r.units)}</b> unidades`);
        if (r.dirty > 0) parts.push(`${S.ze ? "o Zé vendeu e " : ""}entrou <b>${$$(r.dirty)}</b> de grana suja`);
        if (r.clean > 0) parts.push(`a lavagem rendeu <b>${$$(r.clean)}</b> limpos`);
        modal(`Você ficou fora ${dur(r.seconds)}`, (parts.join(", ") || "nada aconteceu") + "." + (r.busted ? "<br><b>A polícia passou por lá enquanto você estava fora.</b>" : ""));
      }
      return;
    }
  } catch (e) {}
  S = E.newState(Math.floor(Math.random() * 1e9));
  welcome();
}
function welcome() {
  const m = el(`<div class="modal"><div class="card">
    <b style="font-size:18px">Bem-vindo ao Greenhood</b>
    <p>Você tem um armário, um vaso e $20.<br>Toque na cena para as plantas crescerem, venda o que colher e <b>cuidado com a Paranoia</b>: em 100% a polícia leva tudo.</p>
    <div class="help" style="display:flex;flex-direction:column;gap:6px">
      <button class="row" data-m="normal" style="text-align:left;width:100%"><div class="ico emo">🌱</div><div class="t"><b>Jogo normal</b><small>O ritmo de verdade: leva dias para chegar ao Bunker.</small></div><span></span></button>
      <button class="row" data-m="easy" style="text-align:left;width:100%"><div class="ico emo">⚡</div><div class="t"><b>Modo fácil</b><small>Para testar com os amigos: tudo cresce 3× mais rápido, vende 2× mais caro e custa 30%. Dá para zerar em ~2 h.</small></div><span></span></button>

  m.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => {

}

const cv = $("cv"), g = cv.getContext("2d");
let W = 320, H = 180, FLOOR = 66, curRoom = -1;
let K = 1;
// cada imóvel tem o seu tamanho de cômodo (16:9); o canvas acompanha
function setRoom() {
  if (S.place === curRoom) return;
  const r = SCENES.size(S.place);
  W = r.w; H = r.h; FLOOR = r.floor; curRoom = S.place;
  fitCanvas();
}
function fitCanvas() {
  const css = cv.getBoundingClientRect().width || W;
  K = Math.max(1, Math.ceil((css * (window.devicePixelRatio || 1)) / W));
  cv.width = W * K; cv.height = H * K;
  g.setTransform(K, 0, 0, K, 0, 0); g.imageSmoothingEnabled = false;
}
window.addEventListener("resize", fitCanvas);
const THEMES = [
  { wall: "#a3423a", mortar: "#6e2834", hi: "#cc6748", floor: "#8f6040", line: "#6b4234" },
  { wall: "#646379", mortar: "#403d54", hi: "#8f90a2", floor: "#8f90a2", line: "#646379" },
  { wall: "#272436", mortar: "#1b4a55", hi: "#2a7470", floor: "#403d54", line: "#352450" },
];
function drawRoom(tier) {
  const t = THEMES[tier];
  g.fillStyle = t.wall; g.fillRect(0, 0, W, FLOOR);
  g.fillStyle = t.mortar;
  if (tier === 0) {
    for (let y = 0; y < FLOOR; y += 8) { g.fillRect(0, y + 7, W, 1); for (let x = (y / 8) % 2 ? 8 : 0; x < W; x += 16) g.fillRect(x + 15, y, 1, 7); }
    g.fillStyle = t.hi; for (let y = 0; y < FLOOR; y += 8) for (let x = (y / 8) % 2 ? 8 : 0; x < W; x += 32) g.fillRect(x, y, 14, 1);
    g.fillStyle = "#1a1420"; g.fillRect(232, 10, 60, 38); g.fillStyle = "#a6cbeb"; g.fillRect(235, 13, 54, 32);
    g.fillStyle = "#6590cc"; g.fillRect(235, 29, 54, 16); g.fillStyle = "#8a4a33"; g.fillRect(261, 13, 2, 32); g.fillRect(235, 28, 54, 2);
  } else if (tier === 1) {
    for (let x = 0; x < W; x += 6) g.fillRect(x, 0, 2, FLOOR);
    g.fillStyle = "#f0c94f"; for (let x = 24; x < W; x += 92) g.fillRect(x, 4, 44, 3);
  } else {
    for (let x = 0; x < W; x += 16) g.fillRect(x, 0, 1, FLOOR);
    for (let y = 0; y < FLOOR; y += 16) g.fillRect(0, y, W, 1);
    g.fillStyle = "#48a38a"; g.fillRect(0, FLOOR - 7, W, 2);
    g.fillStyle = "#8fd4a8"; for (let x = 24; x < W; x += 92) g.fillRect(x, 4, 44, 3);
  }
  g.fillStyle = "#1a1420"; g.fillRect(0, FLOOR - 3, W, 3);
  g.fillStyle = t.floor; g.fillRect(0, FLOOR, W, H - FLOOR);
  g.fillStyle = t.line; for (let y = FLOOR + 12; y < H; y += 22) g.fillRect(0, y, W, 1);
  if (tier === 0) { g.fillStyle = "#ffffff1c"; g.beginPath(); g.moveTo(228, FLOOR); g.lineTo(296, FLOOR); g.lineTo(334, H); g.lineTo(256, H); g.fill(); }
}
// vasos espalhados na área de plantio do cômodo (meta.pots = x, y, largura, altura do topo dos vasos)
function plantArea() {
  const m = SCENES.roomMeta(S.place);
  const [ax, ay, aw, ah0] = m ? m.pots : [24, FLOOR + 34, W - 48, H - FLOOR - 62];
  return [ax, ay, aw, m ? Math.min(ah0, m.room[1] + m.room[3] - 27 - ay) : ah0];
}
// do Container em diante: calhas de hidroponia. Cabem mais plantas (22 px entre elas, contra 30-44 dos vasos)
const HYDRO_SP = 22;
function layoutHydro(n) {
  const m = SCENES.roomMeta(S.place);
  let [ax, ay, aw, ah] = plantArea();
  if (m) ah = Math.max(0, Math.min(ah, m.room[1] + m.room[3] - 8 - GUTTER_H - ay));
  const maxPer = Math.max(1, Math.floor((aw + 10) / HYDRO_SP));
  const rows = Math.ceil(n / maxPer), per = Math.ceil(n / rows);
  const rs = rows > 1 ? Math.min(34, ah / (rows - 1)) : 0;
  const top = ay + (ah - (rows - 1) * rs) / 2;
  const out = [];
  for (let r = 0; r < rows; r++) {
    const count = Math.min(per, n - r * per), gw = count * HYDRO_SP + 8;
    const gx = Math.round(ax + aw / 2 - gw / 2) + (rows > 2 && r % 2 ? 4 : 0), gy = Math.round(top + r * rs) + 6;
    out.push({ x: gx, y: gy, w: gw, count, first: r * per });
  }
  return out;
}
// calha: tampo com os copinhos de rede, frente, pés. tier 1 = PVC branco, tier 2 = high-tech escura com LED verde
const GUTTER_H = 24;
function paintGutter(c, w, count, tier) {
  const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(x, y, ww, hh); };
  const OL = "#1a1420";
  const hi = tier === 2;
  const top = hi ? "#646379" : "#bfbfc8", lip = hi ? "#8f90a2" : "#ebe9e1", front = hi ? "#403d54" : "#ebe9e1", fdark = hi ? "#272436" : "#bfbfc8";
  // cavalete: um par de pés a cada ~44 px, com travessa e sapatinha
  const legs = [3]; for (let x = 47; x < w - 12; x += 44) legs.push(x); legs.push(w - 6);
  R(3, 15, w - 6, 3, OL); R(4, 16, w - 8, 1, "#646379");
  for (const lx of legs) {
    R(lx - 1, 9, 5, 14, OL); R(lx, 9, 3, 13, "#8f90a2"); R(lx, 9, 1, 13, "#bfbfc8"); R(lx + 2, 9, 1, 13, "#646379");
    R(lx - 2, 21, 7, 3, OL); R(lx - 1, 21, 5, 2, "#646379");
  }
  R(0, 0, w, 10, OL);
  R(1, 1, w - 2, 5, top); R(1, 1, w - 2, 1, lip);
  R(1, 6, w - 2, 3, front); R(1, 8, w - 2, 1, fdark);
  if (hi) R(2, 7, w - 4, 1, "#48a38a");
  else { R(w - 9, 6, 4, 3, "#bfbfc8"); R(w - 8, 7, 2, 1, "#646379"); }
  R(w - 2, 3, 2, 3, hi ? "#2a7470" : "#3a5ea3");
  for (let k = 0; k < count; k++) {
    const cx = 4 + HYDRO_SP / 2 + k * HYDRO_SP;
    R(cx - 3, 2, 6, 3, OL); R(cx - 2, 2, 4, 2, "#47292b"); R(cx - 2, 2, 4, 1, "#272436");
  }
}

// ---------------------------------------------------------------- equipamentos na cena
// onde cada um fica: pendurado em cima das plantas, voando, na parede ou no chão (lugar livre)
const EQ_HANG = { lampada: 1, led: 1 };   // a garrafa PET vai em cada vaso (drawPet)
const EQ_BOTTOM = [32, 31, 32, 30, 31, 29, 32, 32, 22, 31, 23, 31, 32, 18, 31, 32, 32, 32];   // última linha pintada de cada sprite
const hitR = (a, b) => !(a[2] <= b[0] || a[0] >= b[2] || a[3] <= b[1] || a[1] >= b[3]);
let slotCache = { sig: "", slots: [] };
function findSlots(m, busy) {
  const sig = S.place + "|" + busy.map((r) => r.join(",")).join(";");
  if (slotCache.sig === sig) return slotCache.slots;
  const [x0, y0, w, h] = m.room, fy = m.floor, [ax, ay, aw, ah] = m.pots, cx = ax + aw / 2, cy = ay + ah / 2;
  const cands = [];
  for (let y = fy - 18; y <= y0 + h - 33; y += 2) for (let x = x0 + 1; x <= x0 + w - 33; x += 2) {
    const body = [x + 5, y + 6, x + 27, y + 31];
    if (busy.some((b) => hitR(body, b))) continue;
    const d = Math.max(Math.abs(x + 16 - cx) - aw / 2, 0) + Math.max(Math.abs(y + 28 - cy) - ah / 2, 0) * 1.4;
    cands.push([d, x, y]);
  }
  cands.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const [, x, y] of cands) {
    if (out.every(([a, b]) => !hitR([x + 3, y + 3, x + 29, y + 31], [a + 3, b + 3, a + 29, b + 31]))) out.push([x, y]);
    if (out.length >= 16) break;
  }
  slotCache = { sig, slots: out };
  return out;
}
const eqPaint = (e) => (c) => { if (sprites.equip) c.drawImage(sprites.equip, (e.frame % 9) * 32, Math.floor(e.frame / 9) * 32, 32, 32, 0, 0, 32, 32); };
// coloca os equipamentos comprados; devolve itens (luz e sombra da cena) e as animações
function placeEquip(m, plantItems, firstPlant) {
  const owned = E.EQUIP.filter((e) => E.lvl(S, e.id) > 0);
  const floor = [], hang = [], anim = [];
  if (!m || !owned.length) return { floor, hang, anim };
  const [x0, y0, w] = m.room;
  const busy = m.busy.map((r) => r.slice()).concat(plantItems.map((it) => [it.x + 2, it.y + 6, it.x + it.w - 2, it.y + it.h + 2]));
  const slots = findSlots(m, busy);
  const top = plantItems.length ? Math.min(...plantItems.map((it) => it.y)) : m.pots[1] - 40;
  const pcx = m.pots[0] + m.pots[2] / 2;
  const onFloor = owned.filter((e) => !EQ_HANG[e.id] && !["drone", "cameras", "regador", "hidro"].includes(e.id)).reverse();   // os mais avançados primeiro
  onFloor.slice(0, Math.min(slots.length, 3 + S.place)).forEach((e, k) => {
    const [x, y] = slots[k];
    floor.push({ x, y, w: 32, h: 32, foot: 32 - EQ_BOTTOM[e.frame], key: "eq:" + e.id, paint: eqPaint(e) });
    anim.push([e.id, x, y]);
  });
  const hangs = owned.filter((e) => EQ_HANG[e.id]);
  const lamps = hangs;
  lamps.forEach((e, k) => {
    const x = Math.round(pcx - 16 + (lamps.length > 1 ? (k ? 26 : -26) : 0)), y = Math.max(y0 - 2, top - 26);
    hang.push({ x, y, w: 32, h: 32, key: "eq:" + e.id, paint: eqPaint(e), noShadow: true, cord: [x + 16, y0 - 2, y + 1] });
    anim.push([e.id, x, y]);
  });
  if (owned.some((e) => e.id === "cameras")) {
    const x = x0 + w - 32, y = y0 - 2;
    hang.push({ x, y, w: 32, h: 32, key: "eq:cameras", paint: eqPaint(E.EQUIP[13]), noShadow: true });
    anim.push(["cameras", x, y]);
  }
  if (owned.some((e) => e.id === "drone")) anim.push(["drone"]);
  return { floor, hang, anim };
}
// animações de cada equipamento (desenhadas por cima, em pixels inteiros)
function eqAnim(a, t, m) {
  const [id, x, y, extra] = a;
  const P = (px, py, pw, ph, col) => { g.fillStyle = col; g.fillRect(Math.round(px), Math.round(py), pw, ph); };
  const blink = (hz, off = 0) => Math.floor(t * hz + off) % 2 === 0;
  switch (id) {
    case "regador": {                                  // gotas caindo da garrafa até a terra
      for (let k = 0; k < 2; k++) {
        const f = (t * 0.9 + k * 0.5) % 1, yy = y + 27 + f * (extra - y - 27);
        if (f < 0.92) P(x + 15, yy, 1, 2, "#a6cbeb"); else P(x + 13, extra, 4, 1, "#6590cc");
      }
      break;
    }
    case "tesoura": if (Math.floor(t * 0.7) % 4 === 0) { P(x + 11, y + 10, 1, 1, "#fffbef"); P(x + 10, y + 11, 3, 1, "#fffbef"); } break;
    case "ventilador": {                               // hélice girando e ventinho indo para as plantas
      const cx = x + 14, cy = y + 12;
      for (let dy = -7; dy <= 7; dy++) { const hw = Math.floor(Math.sqrt(49 - dy * dy)); P(cx - hw, cy + dy, hw * 2 + 1, 1, "#403d54"); }
      const a0 = t * 14;
      for (let k = 0; k < 3; k++) {
        const an = a0 + (k * Math.PI * 2) / 3;
        for (let r = 2; r <= 6; r++) P(cx + Math.cos(an) * r, cy + Math.sin(an) * r, 2, 2, "#bfbfc8");
      }
      P(cx - 1, cy - 1, 3, 3, "#8f90a2"); P(cx, cy, 1, 1, "#fffbef");
      const dir = m && m.pots[0] + m.pots[2] / 2 > x ? 1 : -1;
      for (let k = 0; k < 3; k++) { const f = (t * 0.8 + k / 3) % 1; P(cx + dir * (12 + f * 30), cy - 4 + k * 4 + Math.sin(t * 3 + k) * 2, 4, 1, "rgba(255,251,239," + (0.55 * (1 - f)) + ")"); }
      break;
    }
    case "termometro": { const lv = Math.round(2 + Math.sin(t * 0.8) * 2); P(x + 15, y + 9, 2, 7 + lv, "#ebe9e1"); P(x + 15, y + 16 + lv, 2, 9 - lv, "#d95463"); break; }
    case "lampada": {                                  // cone de luz quente que treme um pouco
      const al = 0.1 + (Math.sin(t * 9) > 0.92 ? 0.05 : 0);
      g.fillStyle = "rgba(255,240,166," + al + ")";
      g.beginPath(); g.moveTo(x + 8, y + 18); g.lineTo(x + 24, y + 18); g.lineTo(x + 40, y + 70); g.lineTo(x - 8, y + 70); g.fill();
      if (blink(1.5)) P(x + 15, y + 20, 2, 1, "#fffbef");
      break;
    }
    case "ph": P(x + 14, y + 15, 5, 1, blink(2) ? "#f2918a" : "#d95463"); P(x + 14, y + 19, 5, 1, blink(2, 1) ? "#bcd95e" : "#4a8f40"); break;
    case "estufa": { const f = (t * 0.25) % 1; P(x + 6, y + 8 + f * 16, 1, 2, "rgba(255,251,239,0.8)"); P(x + 24, y + 12 + ((f + 0.5) % 1) * 12, 1, 2, "rgba(255,251,239,0.6)"); break; }
    case "drone": {                                    // voa em oito pelo cômodo, com sombra no chão
      const [rx, ry, rw, rh] = m.room, cx = rx + rw / 2 + Math.sin(t * 0.35) * rw * 0.32, cy = ry + rh * 0.42 + Math.sin(t * 0.7) * rh * 0.16;
      g.fillStyle = "rgba(26,20,32,0.28)"; g.beginPath(); g.ellipse(Math.round(cx), Math.round(cy + 30), 10, 3, 0, 0, 7); g.fill();
      const bob = Math.round(Math.sin(t * 5) * 1.5), dx = Math.round(cx - 16), dy = Math.round(cy - 14 + bob);
      if (sprites.equip) g.drawImage(sprites.equip, 8 * 32, 0, 32, 32, dx, dy, 32, 32);
      const sp = Math.floor(t * 20) % 2;
      P(dx + 1, dy + 8, 11, 1, sp ? "#bfbfc8" : "#646379"); P(dx + 21, dy + 8, 11, 1, sp ? "#646379" : "#bfbfc8");
      if (blink(2)) P(dx + 13, dy + 15, 2, 1, "#ff6b6b");
      break;
    }
    case "filtro": for (let k = 0; k < 3; k++) { const f = (t * 0.6 + k / 3) % 1; P(x + 12 + k * 3 + Math.sin(t * 2 + k) * 1.5, y - f * 10, 2, 1, "rgba(191,191,200," + (0.7 * (1 - f)) + ")"); } break;
    case "led": {                                      // brilho rosa e roxo que pulsa nas plantas
      const al = 0.07 + 0.04 * Math.sin(t * 2);
      g.fillStyle = "rgba(201,110,190," + al + ")";
      g.beginPath(); g.moveTo(x + 2, y + 16); g.lineTo(x + 30, y + 16); g.lineTo(x + 48, y + 72); g.lineTo(x - 16, y + 72); g.fill();
      for (let k = 0; k < 9; k++) if ((k + Math.floor(t * 4)) % 5 === 0) P(x + 4 + k * 3, y + 7 + (k % 3) * 3, 1, 1, "#fffbef");
      break;
    }
    case "hidro": for (let k = 0; k < 4; k++) { const f = (t * 0.7 + k / 4) % 1; P(x + 6 + k * 5, y + 15 - f * 3, 1, 1, "#fffbef"); } if (blink(1)) P(x + 21, y + 18, 3, 2, "#8fd4a8"); break;
    case "co2": for (let k = 0; k < 3; k++) { const f = (t * 0.5 + k / 3) % 1; P(x + 15 + Math.sin(t + k * 2) * 3, y + 1 - f * 12, 2 + Math.round(f * 2), 2, "rgba(235,233,225," + (0.6 * (1 - f)) + ")"); } break;
    case "cameras": P(x + 14, y + 11, 1, 1, blink(1.5) ? "#ff6b6b" : "#6e1b3d"); break;
    case "osmose": for (let k = 0; k < 4; k++) { const f = (t * 0.5 + k / 4) % 1; P(x + (k % 2 ? 16 : 7), y + 28 - f * 19, 1, 1, "rgba(255,251,239,0.85)"); } break;
    case "ia": {
      for (let k = 0; k < 5; k++) P(x + 9 + k * 3, y + 22, 1, 1, Math.floor(t * 5) % 5 === k ? "#bcd95e" : "#2c6a40");
      const sy = y + 3 + (Math.floor(t * 8) % 10); P(x + 8, sy, 17, 1, "rgba(143,212,168,0.25)");
      break;
    }
    case "bunker": for (let k = 0; k < 7; k++) P(x + 3 + k * 4, y + 29, 2, 2, (k + Math.floor(t * 4)) % 3 === 0 ? "#fff0a6" : "#d1952e"); break;
    case "lab": for (let k = 0; k < 3; k++) { const f = (t * 0.4 + k / 3) % 1; P(x + 13 + k * 3, y + 22 - f * 18, 1, 1, "#fffbef"); } if (blink(1)) P(x + 6, y + 26, 1, 1, "#ff6b6b"); break;
  }
}

// Garrafa PET de 2 L de cabeça para baixo, inclinada, com o gargalo enterrado na terra do vaso.
// Mesma escala do vaso (7 px de largura). A água baixa conforme a planta cresce e volta ao replantar.
const PET = [
  ".OOOOO.",
  "OWaaaBO",
  "OWaaaBO",
  "OWaaaBO",
  "ORRRRRO",
  "OHHHHHO",
  "OWaaaBO",
  "OWaaaBO",
  "OWaaaBO",
  ".OWaBO.",
  "..OaO..",
  "..OCO..",
];
const PET_COL = { O: "#1a1420", W: "#fffbef", a: "#a6cbeb", B: "#6590cc", R: "#d95463", H: "#fffbef", C: "#4a8f40" };
const PET_WATER = [10, 9, 8, 7, 6, 3, 2, 1];             // linhas de dentro, do gargalo para o fundo
function petWater(f) { return Math.round((1 - Math.min(1, f) * 0.85) * PET_WATER.length); }
function drawPet(c, cx, soil, water, flip) {
  const wet = new Set(PET_WATER.slice(0, water));
  const n = PET.length;
  for (let r = 0; r < n; r++) {
    const sh = Math.round((n - 1 - r) * 0.34) * (flip ? -1 : 1);   // inclinação: o fundo vai para o lado
    const row = PET[r];
    for (let k = 0; k < 7; k++) {
      const ch = row[flip ? 6 - k : k];
      if (ch === ".") continue;
      let col = PET_COL[ch];
      if (wet.has(r) && (ch === "a" || ch === "B")) col = ch === "a" ? "#3a5ea3" : "#283c74";
      c.fillStyle = col;
      c.fillRect(cx - 3 + k + sh, soil - n + 1 + r, 1, 1);
    }
  }
}

function layout(n) {
  const [ax, ay, aw, ah] = plantArea();
  let best = null;
  for (let per = 1; per <= n; per++) {               // colunas: espaço parecido com o de um vaso de verdade
    const rows = Math.ceil(n / per);
    const cs = per > 1 ? Math.min(44, aw / (per - 1)) : 0, rs = rows > 1 ? Math.min(34, ah / (rows - 1)) : 0;
    if (per > 1 && cs < 26) break;
    const score = Math.abs((per > 1 ? cs : 44) / (rows > 1 ? rs : 34) - 1.5) + (rows > 1 && rs < 14 ? 5 : 0) + rows * 0.08;
    if (!best || score < best.score) best = { per, rows, cs, rs, score };
  }
  const { per, rows, cs, rs } = best, pts = [];
  const top = ay + (ah - (rows - 1) * rs) / 2;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / per), c = i % per, inRow = Math.min(per, n - r * per);
    const cx = ax + aw / 2 - ((inRow - 1) * cs) / 2 + c * cs + (rows > 2 && r % 2 ? cs * 0.25 : 0);
    pts.push([Math.round(cx - 16), Math.round(top + r * rs)]);
  }
  return { pts };
}
const fx = [];
function float(s, x, y, c = "#fffbef") { fx.push({ s, x, y, c, t: 0 }); if (fx.length > 40) fx.shift(); }
let shake = 0, lastTime = 0;
function draw() {
  const tier = E.PLACES[S.place].tier;
  setRoom();
  g.save();
  if (shake > 0) g.translate(Math.round((Math.random() - 0.5) * shake), 0);
  SCENES.background(g, S.place);
  const hydro = E.lvl(S, "hidro") > 0;               // as calhas chegam com o sistema hidropônico
  const plantOf = (i) => { const p = S.pots[i]; return { p, f: p.on ? p.g / E.SEEDS[p.s].time : 0, st: p.on ? stageCell(p.s, p.on ? p.g / E.SEEDS[p.s].time : 0) : null }; };
  const paintPlant = (st) => (c) => { if (st && sprites.estagios) c.drawImage(sprites.estagios, st[0] * 32, st[1] * 40, 32, 40, 0, 0, 32, 40); };
  const items = [], marks = [];
  let first = null;
  if (hydro) {
    // cada calha, e logo depois as plantas dela (a calha da frente cobre o pé das de trás)
    for (const gt of layoutHydro(S.pots.length)) {
      items.push({ x: gt.x, y: gt.y, w: gt.w, h: GUTTER_H, foot: 0, key: "calha:" + gt.count + ":" + tier, paint: (c) => paintGutter(c, gt.w, gt.count, tier) });
      for (let k = 0; k < gt.count; k++) {
        const i = gt.first + k, { p, f, st } = plantOf(i), cx = gt.x + 4 + HYDRO_SP / 2 + k * HYDRO_SP;
        if (st) items.push({ x: cx - 16, y: gt.y + 4 - 40, w: 32, h: 40, foot: -19, key: "p:" + st.join(","), paint: paintPlant(st) });
        if (st && !first) first = items[items.length - 1];
        marks.push({ on: p.on, f, x: cx, top: gt.y + 4 - 26, bar: [cx - 4, gt.y + 7, 8] });
      }
    }
  } else {
    // cada vaso + planta é um sprite 32x58 (vaso embaixo, planta saindo da terra)
    layout(S.pots.length).pts.forEach(([x, y], i) => {
      const { p, f, st } = plantOf(i);
      const pf = i % 3 === 2 ? 2 : i % 2;
      // garrafa PET (se comprada) faz parte do sprite do vaso: ganha a luz e a profundidade da cena
      const pet = E.lvl(S, "regador") > 0 ? petWater(f) : -1, flip = i % 2 === 1;
      items.push({ x, y: y - 34, w: 32, h: 58, foot: 2, key: pf + ":" + (st ? st.join(",") : "-") + ":" + pet + (flip ? "f" : ""),
        paint(c) {
          if (sprites.vasos) c.drawImage(sprites.vasos, pf * 32, 0, 32, 24, 0, 34, 32, 24);
          paintPlant(st)(c);
          if (pet >= 0) drawPet(c, 16 + (flip ? -7 : 7), 38, pet, flip);
        } });
      marks.push({ on: p.on, f, x: x + 16, top: y - 25, bar: [x + 8, y + 22, 16], pot: true, flip: i % 2 === 1 });
      if (!first) first = { x, y: y - 34 };
    });
  }
  // a cena acende cada sprite pelo mapa de luz e projeta a sombra
  // equipamentos comprados entram na cena: no chão (com as plantas, por profundidade), pendurados e voando
  const room = SCENES.roomMeta(S.place);
  const EQ = placeEquip(room, items, first);
  const ground = (it) => it.y + it.h - 1 - (it.foot || 0);
  const all = items.concat(EQ.floor).map((it, k) => [it, k]).sort((a, b) => ground(a[0]) - ground(b[0]) || a[1] - b[1]).map((a) => a[0]);
  for (const hg of EQ.hang) if (hg.cord) { g.fillStyle = "#1a1420"; g.fillRect(hg.cord[0], hg.cord[1], 1, Math.max(0, hg.cord[2] - hg.cord[1])); }
  if (sprites.vasos && sprites.estagios) SCENES.plants(g, S.place, all.concat(EQ.hang));
  for (const a of EQ.anim) eqAnim(a, lastTime, room);
  for (const m of marks) {
    if (!m.on) { g.fillStyle = "#d95463"; g.font = "bold 9px monospace"; g.fillText("$", m.x - 3, m.top + 27); }
    else if (m.f > 0.92 && Math.floor(lastTime * 4) % 2 === 0) { g.fillStyle = "#fff0a6"; g.fillRect(m.x + 8, m.top, 1, 3); g.fillRect(m.x + 7, m.top + 1, 3, 1); }
    const [bx, by, bw] = m.bar;
    g.fillStyle = "#1a1420"; g.fillRect(bx, by, bw, m.pot ? 3 : 2);
    g.fillStyle = "#7cb342"; g.fillRect(bx + (m.pot ? 1 : 0), by + (m.pot ? 1 : 0), Math.round((bw - (m.pot ? 2 : 0)) * Math.min(1, m.f)), 1);
  }
  SCENES.lighting(g, S.place);
  g.restore();
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i]; p.t += 1 / 60; p.y -= 0.45;
    g.globalAlpha = Math.max(0, 1 - p.t / 1.2);
    g.font = "bold 10px 'Silkscreen',monospace";
    g.fillStyle = "#1a1420"; g.fillText(p.s, p.x + 1, p.y + 1); g.fillStyle = p.c; g.fillText(p.s, p.x, p.y);
    g.globalAlpha = 1;
    if (p.t > 1.2) fx.splice(i, 1);
  }
  shake = Math.max(0, shake - 0.6);
}

let binds = [];

function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function h3(text) { panel.appendChild(el(`<h3>${text}</h3>`)); }
function row({ ico, emoji, title, lv, desc, btn, cls = "", btnCls = "", enabled, onClick }) {
  const d = el(`<div class="row ${cls}"><div></div><div class="t"><b>${title}${lv != null ? `<span class="lv">${typeof lv === "number" ? "nv " + lv : lv}</span>` : ""}</b><small>${desc}</small></div></div>`);

function estufa() {
  const cur = E.SEEDS[S.seed];
  h3(`Sementes · plantando ${cur.name}`);
  // lucro por minuto de cada vaso: é o que diz se vale a pena plantar
  const perMin = (sd) => (Math.max(1, Math.floor(sd.prod * E.prodMult(S))) * sd.sell - sd.price) / (sd.time / E.speed(S) / 60);
  const okSeeds = E.SEEDS.filter((sd, i) => E.seedOk(S, i));
  const best = okSeeds.reduce((a, b) => (perMin(b) > perMin(a) ? b : a), okSeeds[0]);
  E.SEEDS.map((sd, i) => [sd, i]).reverse().forEach(([sd, i]) => {
    const lock = E.seedLocked(S, sd);
    const profit = Math.max(1, Math.floor(sd.prod * E.prodMult(S))) * sd.sell - sd.price;
    if (lock.length && i > 0 && E.seedLocked(S, E.SEEDS[i - 1]).length) return; // mostra só a próxima trancada
    row({
      ico: seedIcon(i), title: sd.name, cls: (i === S.seed ? "sel" : "") + (lock.length ? " locked" : ""),
      desc: lock.length ? `<span class="req">Precisa: ${lock.join(", ")}</span>`
        : `Semente ${$$(sd.price)} · ${Math.max(1, Math.floor(sd.prod * E.prodMult(S)))} un × ${$$(sd.sell)} · ${dur(sd.time / E.speed(S))}<br>` +
          `<span class="gain">+${$$(perMin(sd))}/min por vaso</span> <span class="gain2">(+${$$(profit)} por colheita)</span>${sd === best ? ' <span class="best">★ mais lucro</span>' : ""}`,
      btn: lock.length ? null : i === S.seed ? "Plantando" : "Plantar", enabled: () => i !== S.seed,
      onClick: () => E.chooseSeed(S, i),
    });
  });
  h3("Esconderijo");
  const pl = E.PLACES[S.place];
  if (S.pots.length < E.maxPots(S)) row({
    ico: icon("vasos", 32, 0, 32, 24), title: "Mais um vaso", desc: `${S.pots.length} de ${pl.pots} vasos no ${pl.name}. Pago com grana suja.`,
    btn: $$(E.potCost(S)), btnCls: "dirty", enabled: () => S.dirty >= E.potCost(S), onClick: () => E.buyPot(S),
  });
  const np = E.PLACES[S.place + 1];
  if (np) row({
    ico: icon("vasos", 64, 0, 32, 24), title: np.name, desc: `Cabem ${np.pots} plantas.${np.tier > pl.tier ? " Visual novo!" : ""} Pago com grana limpa.<br><span class="req">Os equipamentos ficam para trás (menos os de compra única).</span>`,
    btn: $$(E.placeCost(S)), btnCls: "clean", enabled: () => S.clean >= E.placeCost(S), onClick: () => E.buyPlace(S),
  });
  if (!S.ze) row({
    ico: icon("estagios", 64, 40, 32, 40), title: "Contratar o Zé", desc: `Vende sozinho no Discreto a cada ${E.R.zeEvery}s, até com o app fechado.`,
    btn: $$(E.R.zeCost), btnCls: "clean", enabled: () => S.clean >= E.R.zeCost, onClick: () => E.hireZe(S),
  });
}

let billCombo = 1, billLast = 0;
function sparkline(id) {
  const c = document.createElement("canvas"); c.className = "spark"; c.width = 72; c.height = 18;
  const x = c.getContext("2d");
  const draw = () => {
    x.clearRect(0, 0, 72, 18);
    x.fillStyle = "#272436"; x.fillRect(0, 0, 72, 18);
    x.fillStyle = "#403d54"; x.fillRect(0, 9, 72, 1);                   // taxa normal
    for (let i = 0; i < 72; i++) {
      const m = E.marketMult(id, S.time - 600 + (i * 600) / 71);
      const y = Math.round(16 - ((m - 0.3) / 1.5) * 14);
      x.fillStyle = m < 0.8 ? "#7cdc5a" : m > 1.2 ? "#d95463" : "#bfbfc8";
      x.fillRect(i, y, 1, 2);
    }
    const m = E.marketMult(id, S.time), y = Math.round(16 - ((m - 0.3) / 1.5) * 14);
    x.fillStyle = "#fffbef"; x.fillRect(69, y - 1, 3, 3);
  };
  draw(); bind(draw);
  return c;
}
function lavagem() {
  panel.appendChild(el(`<div class="card"><p>Venda dá <b>grana suja</b>. Equipamentos, imóveis e a cidade só aceitam <b>grana limpa</b>. A <b>reserva para replantar</b> (<span data-r></span>) fica sempre guardada: fachadas e maquininha não encostam nela.</p></div>`));
  bind(() => (panel.querySelector("[data-r]").textContent = $$(E.reserve(S))));
  cashCard();

  // ---- maquininha de contar notas
  h3("Maquininha de contar notas");
  const mc = el(`<div class="machine"><div><div class="big">📠 Toque rápido para passar os maços. <b>Sem taxa.</b></div>
    <small data-v></small><div><span class="combo" data-c>×1</span> <span class="got" data-g></span></div></div>
    <button data-b>CONTAR</button></div>`);
  const got = mc.querySelector("[data-g]"), comboEl = mc.querySelector("[data-c]");
  mc.querySelector("[data-b]").addEventListener("pointerdown", (ev) => {
    ev.preventDefault();
    const now = performance.now() / 1000;
    billCombo = now - billLast < 0.6 ? Math.min(E.BILL_MAX, billCombo + 1) : 1;   // cada toque rápido: +1, até ×50
    billLast = now;
    const amt = E.countBills(S, billCombo);
    if (amt > 0) { got.textContent = "+" + $$(amt) + " limpos"; got.style.color = ""; }
    else { got.textContent = S.sta < 1 ? "Sem energia ⚡" : S.dirty <= E.reserve(S) ? "Só sobrou a reserva" : "Paranoia alta demais"; got.style.color = "#f2918a"; }
    comboEl.textContent = "×" + billCombo + (billCombo >= E.BILL_MAX ? " MÁX!" : "");
    comboEl.style.color = billCombo >= E.BILL_MAX ? "#ff6b6b" : billCombo >= 25 ? "#f0a050" : billCombo >= 10 ? "#f0c94f" : "";
    comboEl.style.fontSize = Math.min(28, 16 + billCombo * 0.25) + "px";
    refresh();
  });
  bind(() => {
    mc.querySelector("[data-v]").textContent = `${$$(E.billValue(S))} por toque (combo até ×50: não pare de tocar!) · −1⚡ · +0,15 Paranoia`;
    if (performance.now() / 1000 - billLast > 0.8 && billCombo > 1) { billCombo = 1; comboEl.textContent = "×1"; comboEl.style.color = ""; comboEl.style.fontSize = ""; }
  });
  panel.appendChild(mc);

  // ---- fachadas
  h3("Fachadas (lavam sozinhas, até com o jogo fechado)");
  E.FRONTS.forEach((f, i) => {
    const lv = E.frontLvl(S, f.id), cost = E.frontCost(S, f);
    const prev = E.FRONTS[i - 1];
    if (!lv && prev && !E.frontLvl(S, prev.id)) return;                    // mostra só a próxima a abrir
    const capNow = E.frontCap(f, lv), capNext = E.frontCap(f, lv + 1);
    const d = row({
      emoji: f.emoji, title: f.name, lv: lv ? `nv ${lv}/${E.FRONT_MAX}` : "fechada",
      desc: (lv ? `Lava <span class="gain">${$$(capNow)}/min</span> · taxa ${pct(f.fee)} · <span data-st></span>` : `Abre lavando <span class="gain">${$$(capNext)}/min</span> · taxa ${pct(f.fee)}`) +
        (lv < E.FRONT_MAX && lv ? `<br><span class="gain2">Próximo nível: ${$$(capNext)}/min</span>` : ""),
      btn: lv >= E.FRONT_MAX ? "Máximo" : $$(cost), btnCls: "clean",
      enabled: () => lv < E.FRONT_MAX && S.clean >= cost, onClick: () => E.buyFront(S, f.id),
    });
    const st = d.querySelector("[data-st]");
    if (st) bind(() => {
      const closed = S.closed && S.closed[f.id] > S.time;
      st.innerHTML = S.fiscal && S.fiscal.id === f.id ? `<span class="bad">fiscal na porta!</span>`
        : closed ? `<span class="bad">fechada por ${dur(S.closed[f.id] - S.time)}</span>`
        : S.dirty > E.reserve(S) ? `<span class="good">lavando</span>` : `parada (só tem a reserva)`;
    });
  });

  // ---- lavagem na hora (com mercado)
  h3("Lavar na hora");
  E.LAUNDRY.forEach((m) => {
    const lock = S.attrs.lab < m.lab;
    const market = m.id === "crypto" || m.id === "nft";
    const d = row({
      emoji: { laranjas: "🍊", nft: "🖼️", crypto: "₿", consultoria: "📊" }[m.id], title: m.name, cls: lock ? "locked" : "",
      desc: lock ? `<span class="req">Precisa de Lábia ${m.lab}</span>` : market ? `<span data-sp></span><br><span data-fee></span> · ${m.time ? dur(m.time) : "na hora"} · +${m.para} Paranoia`
        : `Taxa ${pct(m.fee)} · ${m.time ? dur(m.time) : "na hora"} · +${m.para} Paranoia`,
    });
    if (market && !lock) {
      d.querySelector("[data-sp]").replaceWith(sparkline(m.id));
      const fe = d.querySelector("[data-fee]");
      bind(() => {
        const fee = E.marketFee(S, m.id), k = E.marketMult(m.id, S.time);
        fe.innerHTML = `Taxa <b>${pct(fee)}</b>${k < 0.8 ? ' <span class="good">boa hora!</span>' : k > 1.2 ? ' <span class="bad">cara</span>' : ""}`;
      });
    }
    if (!lock) {
      const chips = el(`<div class="chips"></div>`);
      [0.25, 0.5, 1].forEach((fr) => {
        const b = el(`<button class="buy clean">${fr === 1 ? "Tudo" : pct(fr)}</button>`);
        b.onclick = () => { if (E.launder(S, m.id, fr)) { renderPanel(); refresh(); } else toast("Agora não: Paranoia alta demais ou sem grana suja.", true); };
        bind(() => (b.disabled = S.dirty < 1));
        chips.appendChild(b);
      });
      d.lastElementChild.replaceWith(chips);
    }
  });
  if (S.laundry.length) {
    h3("Lavando agora");
    S.laundry.forEach((l) => {
      const m = E.LAUNDRY.find((x) => x.id === l.id);
      const c = el(`<div class="card"><p>${m.name}: <b>${$$(l.net)}</b> limpos em <span data-t></span></p><div class="prog"><i></i></div></div>`);
      bind(() => { c.querySelector("[data-t]").textContent = dur(l.done - S.time); c.querySelector("i").style.width = pct(1 - (l.done - S.time) / m.time); });
      panel.appendChild(c);
    });
  }
}
